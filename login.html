<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECOMAX — ავტორიზაცია</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#02070b;color:#fff;font-family:"Noto Sans Georgian",sans-serif;overflow:hidden}body:before{content:"";position:fixed;inset:-20%;background:linear-gradient(90deg,transparent 49.8%,rgba(25,230,255,.12) 50%,transparent 50.2%),linear-gradient(0deg,transparent 49.8%,rgba(25,230,255,.1) 50%,transparent 50.2%);background-size:80px 80px;transform:perspective(600px) rotateX(60deg) translateY(18%);opacity:.3}.scene{width:min(470px,calc(100% - 28px));perspective:1200px}.card{padding:40px;border-radius:26px;background:linear-gradient(145deg,rgba(9,24,31,.96),rgba(2,9,14,.98));border:1px solid rgba(25,230,255,.28);box-shadow:0 35px 100px #000,0 0 45px rgba(25,230,255,.08);transform:rotateX(2deg) rotateY(-2deg);position:relative}.card:after{content:"";position:absolute;inset:10px;border:1px solid rgba(25,230,255,.08);border-radius:19px;pointer-events:none}.logo{text-align:center;font:bold 30px Arial;letter-spacing:6px}.logo i{color:#19e6ff;font-style:normal;text-shadow:0 0 25px #19e6ff}.orb{width:78px;height:78px;margin:22px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 3%,#28eaff 9%,#087d95 35%,#03151b 70%);box-shadow:0 0 30px rgba(25,230,255,.7),0 0 80px rgba(25,230,255,.16)}h1{text-align:center;font-size:25px;margin:4px 0 7px}.sub{text-align:center;color:#8da7b1;font-size:13px;margin-bottom:27px}.field{margin:15px 0}label{display:block;font-size:13px;color:#bfd0d5;margin-bottom:7px}input{width:100%;padding:14px;border-radius:11px;border:1px solid #20424e;background:#030c12;color:#fff;outline:0;font:inherit}input:focus{border-color:#19e6ff;box-shadow:0 0 0 3px rgba(25,230,255,.08)}.password{position:relative}.password button{position:absolute;right:7px;top:7px;width:42px;padding:8px;background:#0b2028;color:#a9c5cd;border:1px solid #173b46;border-radius:8px;cursor:pointer}.submit{width:100%;margin-top:9px;padding:15px;border:0;border-radius:11px;background:#19e6ff;color:#001116;font-weight:900;font:inherit;cursor:pointer}.submit:disabled{opacity:.5}.msg{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:13px}.ok{display:block;border:1px solid #248b68;color:#87edc6;background:#082219}.err{display:block;border:1px solid #923643;color:#ffadb7;background:#240b10}.links{text-align:center;color:#8299a2;font-size:13px;margin-top:20px}.links a{color:#19e6ff;text-decoration:none}.home{display:block;text-align:center;color:#6f858e;text-decoration:none;font-size:12px;margin-top:15px}</style></head><body><div class="scene"><div class="card"><div class="logo"><i>✦</i> ECOMAX</div><div class="orb"></div><h1>ავტორიზაცია</h1><div class="sub">შედი შენს პროფესიონალურ ECOMAX ანგარიშში</div><form id="form"><div class="field"><label>ელფოსტა</label><input id="email" type="email" autocomplete="email" required placeholder="example@gmail.com"></div><div class="field"><label>პაროლი</label><div class="password"><input id="password" type="password" autocomplete="current-password" required placeholder="პაროლი"><button type="button" onclick="togglePass()">◉</button></div></div><button class="submit" id="btn">შესვლა</button></form><div id="msg" class="msg"></div><div class="links">არ გაქვს ანგარიში? <a href="register.html">რეგისტრაცია</a></div><a class="home" href="index.html">← მთავარ გვერდზე</a></div></div><script>
const db=supabase.createClient("https://mkxkqdvtmfbxmldnvsef.supabase.co","sb_publishable_K5orPxr9E0q9-K0dKYdt-g_0GTFvWtd");const msg=document.getElementById("msg");function show(t,c){msg.textContent=t;msg.className="msg "+c}function togglePass(){const p=document.getElementById("password");p.type=p.type==="password"?"text":"password"}document.getElementById("form").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("btn");b.disabled=true;b.textContent="მიმდინარეობს...";const {data,error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){show(/invalid login credentials/i.test(error.message)?"ელფოსტა ან პაროლი არასწორია.":/email not confirmed/i.test(error.message)?"ელფოსტა ჯერ არ არის დადასტურებული.":error.message,"err");b.disabled=false;b.textContent="შესვლა";return}if(data.session){show("ავტორიზაცია წარმატებულია. გადამისამართება...","ok");setTimeout(()=>location.href="index.html",700)}};</script></body></html>
