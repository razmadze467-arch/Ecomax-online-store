<main class="wrap">
<section class="intro"><div class="brand">ECOMAX</div><div class="tag">PROFESSIONAL AUTO CARE</div><h1>კეთილი იყოს შენი <span>დაბრუნება.</span></h1><p>შედი შენს ECOMAX ანგარიშში და გააგრძელე შეკვეთა.</p></section>
<section class="card"><div class="label">ECOMAX ACCOUNT</div><h2>ავტორიზაცია</h2><div class="sub">შეიყვანე ელფოსტა და პაროლი.</div><div id="msg" class="msg"></div>
<form id="loginForm">
<div class="field"><label for="email">ელფოსტა</label><input id="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">პაროლი</label><input id="password" type="password" autocomplete="current-password" required></div>
<div class="row"><label><input type="checkbox" checked> დამიმახსოვრე</label><a href="#" id="forgot">დამავიწყდა პაროლი</a></div>

<script>
(function(){'use strict';
const redirectTarget=new URLSearchParams(location.search).get("redirect");
const registerLink=document.getElementById("registerLink");
if(registerLink && redirectTarget==="checkout.html") registerLink.href="register.html?redirect=checkout.html";
const __redirect=new URLSearchParams(location.search).get('redirect');
const __registerLink=document.getElementById('registerLink');
if(__registerLink && __redirect==='checkout.html') __registerLink.href='register.html?redirect=checkout.html';
let client;
const SUPABASE_URL='https://mkxkqdvtmfbxmldnvsef.supabase.co';
const SUPABASE_KEY='sb_publishable_K5orPxr9E0q9-K0dKYdt-g_0GTFvWtd';
async function getAuthClient(){
  if(window.ECOMAX_AUTH_READY){
    const ready=await window.ECOMAX_AUTH_READY;
    if(ready?.auth) return ready;
  }
  if(window.supabase?.createClient){
    return window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
      auth:{storageKey:'ecomax-auth',storage:window.localStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}
    });
  }
  throw new Error('Supabase ვერ ჩაიტვირთა. გვერდი თავიდან განაახლე.');
}
const $=id=>document.getElementById(id),msg=$('msg'),btn=$('loginBtn');
function show(t,c){msg.textContent=t;msg.className='msg show '+(c||'error')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(btn.disabled)return;const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||!password){show('შეავსე ორივე ველი.');return}btn.disabled=true;btn.textContent='მიმდინარეობს...';try{client=await getAuthClient();const r=await client.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data.session)throw new Error('სესია ვერ შეიქმნა.');const persisted=await client.auth.setSession({access_token:r.data.session.access_token,refresh_token:r.data.session.refresh_token});if(persisted.error)throw persisted.error;\nconst saveBackup=window.ECOMAX_SAVE_SESSION_BACKUP;\nif(saveBackup) saveBackup(persisted?.data?.session || r.data.session);\nshow('ავტორიზაცია წარმატებულია.','success');setTimeout(()=>{const target=new URLSearchParams(location.search).get('redirect');const role=String(r.data.user?.app_metadata?.role||'').toLowerCase();if(role==='courier'){location.replace('line.html');return}location.replace(target==='checkout.html'?'checkout.html':'account.html')},250)}catch(e){show(e?.message||'ავტორიზაცია ვერ შესრულდა.');btn.disabled=false;btn.textContent='შესვლა'}});
$('forgot').addEventListener('click',async e=>{e.preventDefault();const email=$('email').value.trim().toLowerCase();if(!email){show('ჯერ შეიყვანე ელფოსტა.');return}try{client=await getAuthClient();const r=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/login.html'});if(r.error)throw r.error;show('პაროლის აღდგენის ბმული გაიგზავნა.','success')}catch(e){show(e?.message||'პაროლის აღდგენა ვერ შესრულდა.')}});
})();
</script>
