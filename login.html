<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ECOMAX — შესვლა</title>
<style>
:root{--bg:#04080d;--card:#0a131d;--text:#eefaff;--muted:#8ea3ae;--cyan:#19e6ff;--blue:#48a9ff;--red:#ff647d;--green:#45e3a3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:var(--text);background:#04080d}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;overflow-x:hidden}.bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 15%,#083746 0,transparent 34%),radial-gradient(circle at 85% 25%,#21134c 0,transparent 36%)}.wrap{position:relative;z-index:1;width:min(100%,1080px);display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,430px);gap:48px;align-items:center}.intro{padding:16px}.brand{font-weight:900;letter-spacing:5px;color:var(--cyan);font-size:27px;text-shadow:0 0 24px #19e6ff55}.tag{margin-top:48px;color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:2px}.intro h1{font-size:clamp(40px,6vw,72px);line-height:1;letter-spacing:-3px;margin:14px 0}.intro h1 span{color:var(--cyan)}.intro p{max-width:560px;color:var(--muted);line-height:1.8;font-size:14px}.card{background:linear-gradient(145deg,#0e1b27f5,#060c12f8);border:1px solid #19e6ff22;border-radius:24px;padding:28px;box-shadow:0 25px 80px #0009}.label{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:2px}.card h2{font-size:28px;margin:7px 0}.sub{color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:22px}.field{margin:14px 0}.field label{display:block;color:#c9d7dd;font-size:11px;margin-bottom:7px}.field input{width:100%;height:52px;border:1px solid #ffffff16;border-radius:12px;background:#03070bcc;color:var(--text);padding:0 14px;font-size:16px;outline:0}.field input:focus{border-color:#19e6ff77;box-shadow:0 0 0 3px #19e6ff12}.row{display:flex;justify-content:space-between;align-items:center;margin:15px 0 20px;font-size:11px}.row label{color:var(--muted)}a{color:var(--cyan);text-decoration:none}.btn{width:100%;height:52px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#001015;font-weight:900;font-size:15px;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.msg{display:none;padding:12px;border-radius:11px;font-size:11px;line-height:1.6;margin-bottom:14px}.msg.show{display:block}.msg.error{background:#ff647d10;border:1px solid #ff647d35;color:#ffb4c0}.msg.success{background:#45e3a310;border:1px solid #45e3a335;color:#a7f1d1}.foot{text-align:center;color:#687983;font-size:11px;margin-top:20px}.back{display:inline-block;margin-top:18px;color:#9fb0b8;font-size:11px}@media(max-width:820px){body{padding:14px}.wrap{grid-template-columns:1fr;gap:14px}.intro{padding:8px;text-align:center}.tag{margin-top:18px}.intro p{margin:auto}.card{padding:22px}}@media(max-width:430px){.intro h1{font-size:35px;letter-spacing:-2px}.brand{font-size:21px}.card{padding:18px;border-radius:18px}.row{gap:10px;align-items:flex-start}}
</style>
</head>
<body><div class="bg"></div>
<main class="wrap">
<section class="intro"><div class="brand">ECOMAX</div><div class="tag">PROFESSIONAL AUTO CARE</div><h1>კეთილი იყოს შენი <span>დაბრუნება.</span></h1><p>შედი შენს ECOMAX ანგარიშში და გააგრძელე შეკვეთა მარტივად — ტელეფონიდანაც და კომპიუტერიდანაც.</p></section>
<section class="card"><div class="label">ECOMAX ACCOUNT</div><h2>ავტორიზაცია</h2><div class="sub">შეიყვანე ელფოსტა და პაროლი.</div><div id="msg" class="msg"></div>
<form id="loginForm" novalidate>
<div class="field"><label for="email">ელფოსტა</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required></div>
<div class="field"><label for="password">პაროლი</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<div class="row"><label><input id="remember" type="checkbox" checked> დამიმახსოვრე</label><a href="#" id="forgot">დამავიწყდა პაროლი</a></div>
<button class="btn" id="loginBtn" type="submit">შესვლა</button></form>
<div class="foot">არ გაქვს ანგარიში? <a href="register.html">რეგისტრაცია</a><br><a class="back" href="index.html">← მთავარ გვერდზე</a></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://mkxkqdvtmfbxmldnvsef.supabase.co';
const SUPABASE_KEY='sb_publishable_K5orPxr9E0q9-K0dKYdt-g_0GTFvWtd';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'ecomax-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
window.ECOMAX_SUPABASE_CLIENT=client;window.ECOMAX_AUTH_CLIENT=client;
const $=id=>document.getElementById(id),msg=$('msg'),btn=$('loginBtn');
function show(text,type){msg.textContent=text;msg.className='msg show '+(type||'error')}
function target(){const r=new URLSearchParams(location.search).get('redirect');return r&&/^[A-Za-z0-9_\/-]+\.html(?:\?[A-Za-z0-9_=&-]*)?$/.test(r)?r:'account.html'}
(async function(){try{const r=await client.auth.getSession();if(r.data&&r.data.session)location.replace(target())}catch(e){}})();
$('forgot').addEventListener('click',async function(e){e.preventDefault();const email=$('email').value.trim();if(!email){show('ჯერ შეიყვანე ელფოსტა.');return}try{const r=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/login.html'});if(r.error)throw r.error;show('პაროლის აღდგენის ბმული გაიგზავნა ელფოსტაზე.','success')}catch(e){show(e&&e.message?e.message:'პაროლის აღდგენა ვერ შესრულდა.')}});
$('loginForm').addEventListener('submit',async function(e){e.preventDefault();if(btn.disabled)return;const email=$('email').value.trim(),password=$('password').value;if(!email||!password){show('შეავსე ორივე ველი.');return}btn.disabled=true;btn.textContent='მიმდინარეობს...';try{const r=await client.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data||!r.data.session)throw new Error('სესია ვერ შეიქმნა.');show('ავტორიზაცია წარმატებულია.','success');setTimeout(function(){location.replace(target())},300)}catch(e){show(e&&e.message?e.message:'ავტორიზაცია ვერ შესრულდა.');btn.disabled=false;btn.textContent='შესვლა'}});
})();
</script></body></html>
