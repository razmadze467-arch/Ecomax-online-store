<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECOMAX — შესვლა</title><link rel="stylesheet" href="css/style.css"><style>
.authPage{min-height:calc(100vh - 38px);display:grid;place-items:center;padding:55px 16px;position:relative;overflow:hidden}.authPage:before,.authPage:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.16;pointer-events:none}.authPage:before{background:#28e7ff;left:-180px;top:10%}.authPage:after{background:#8b5cf6;right:-180px;bottom:0}.authCard{width:min(450px,100%);position:relative;z-index:1;background:#091119dd;backdrop-filter:blur(22px);border:1px solid #28e7ff33;border-radius:28px;padding:34px;box-shadow:0 30px 100px #0008}.back{display:inline-block;color:var(--muted);font-size:13px;margin-bottom:30px}.back:hover{color:var(--accent)}.authLogo{text-align:center;font:700 31px 'Space Grotesk';letter-spacing:7px;color:var(--accent);text-shadow:0 0 28px #28e7ff55}.authTitle{text-align:center;font:700 30px 'Space Grotesk';margin:16px 0 8px}.authSub{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 28px}.field{margin:14px 0}.field label{display:block;color:#c5d0d7;font-size:12px;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:13px;background:#050a0f;color:var(--text);outline:none;transition:.2s}.field input:focus{border-color:#28e7ff88;box-shadow:0 0 0 4px #28e7ff10}.submit{width:100%;padding:14px;margin-top:8px}.authRow{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:15px;font-size:12px}.authRow a{color:var(--accent)}.msg{min-height:20px;text-align:center;font-size:13px;margin-top:14px;color:var(--muted)}.divider{display:flex;align-items:center;gap:12px;color:#52616b;font-size:11px;margin:25px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.secure{text-align:center;color:#667681;font-size:11px;margin-top:25px}@media(max-width:500px){.authCard{padding:25px;border-radius:22px}}
</style></head><body><div class="topbar">ECOMAX • SECURE ACCESS</div><main class="authPage"><section class="authCard">
<a class="back" href="index.html">← მთავარ გვერდზე დაბრუნება</a>
<div class="authLogo">ECOMAX</div><h1 class="authTitle">კეთილი იყოს შენი დაბრუნება</h1><p class="authSub">შედი შენს ანგარიშში და გააგრძელე ECOMAX-ის გამოცდილება.</p>
<form id="loginForm" novalidate><div class="field"><label for="email">ელფოსტა</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="password">პაროლი</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required></div><div class="authRow"><label><input id="remember" type="checkbox"> დამამახსოვრე</label><a href="#" id="forgot">პაროლი დამავიწყდა?</a></div><button class="primary submit" type="submit">შესვლა →</button><div id="msg" class="msg"></div></form>
<div class="divider">ან</div><p style="text-align:center;color:var(--muted);font-size:13px;margin:0">ჯერ არ გაქვს ანგარიში? <a href="register.html" style="color:var(--accent)">რეგისტრაცია</a></p><div class="secure">🔒 დაცული ავტორიზაცია • ECOMAX</div>
</section></main></body></html>
