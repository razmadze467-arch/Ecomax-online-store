<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ECOMAX — ავტორიზაცია</title>
<style>
:root{--bg:#020812;--card:#08131f;--text:#effaff;--muted:#8ea3ae;--cyan:#00f6ff;--blue:#168dff;--red:#ff647d;--green:#45e3a3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--text);background:var(--bg)}
body{min-height:100vh;display:grid;place-items:center;padding:18px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 10%,#083746 0,transparent 34%),radial-gradient(circle at 85% 25%,#21134c 0,transparent 36%),linear-gradient(rgba(0,246,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,246,255,.022) 1px,transparent 1px);background-size:auto,auto,44px 44px}
.wrap{position:relative;z-index:2;width:min(100%,500px)}
.card{background:linear-gradient(145deg,#0e1b27,#060c12);border:1px solid #19e6ff35;border-radius:24px;padding:28px;box-shadow:0 25px 80px #0009,0 0 35px #00f6ff10}
.brand{font-weight:900;letter-spacing:5px;color:var(--cyan);font-size:24px}.label{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:2px;margin-top:22px}
h1{font-size:30px;margin:8px 0}.sub{color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:20px}
.field{margin:14px 0}.field label{display:block;color:#c9d7dd;font-size:11px;margin-bottom:7px}.field input{width:100%;height:52px;border:1px solid #ffffff18;border-radius:12px;background:#03070b;color:var(--text);padding:0 14px;font-size:16px;outline:0}.field input:focus{border-color:#19e6ff77;box-shadow:0 0 0 3px #19e6ff12}
.row{display:flex;justify-content:space-between;align-items:center;margin:15px 0 20px;font-size:11px;color:var(--muted)}a{color:var(--cyan);text-decoration:none}
.btn{width:100%;height:52px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#001015;font-weight:900;font-size:15px;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}
.msg{display:none;padding:12px;border-radius:11px;font-size:11px;line-height:1.6;margin-bottom:14px}.msg.show{display:block}.error{background:#ff647d10;border:1px solid #ff647d35;color:#ffb4c0}.success{background:#45e3a310;border:1px solid #45e3a335;color:#a7f1d1}
.foot{text-align:center;color:#687983;font-size:11px;margin-top:20px}.back{display:inline-block;margin-top:18px;color:#9fb0b8}
@media(max-width:430px){body{padding:12px}.card{padding:20px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="wrap"><section class="card">
<div class="brand">ECOMAX</div><div class="label">ECOMAX ACCOUNT</div><h1>ავტორიზაცია</h1>
<div class="sub">შეიყვანე ელფოსტა და პაროლი.</div><div id="msg" class="msg"></div>
<form id="loginForm" novalidate>
<div class="field"><label for="email">ელფოსტა</label><input id="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">პაროლი</label><input id="password" type="password" autocomplete="current-password" required></div>
<div class="row"><label><input id="remember" type="checkbox" checked> დამიმახსოვრე</label><a href="#" id="forgot">დამავიწყდა პაროლი</a></div>
<button class="btn" id="loginBtn" type="submit">შესვლა</button>
</form>
<div class="foot">არ გაქვს ანგარიში? <a id="registerLink" href="register.html">რეგისტრაცია</a><br><a class="back" href="index.html">← მთავარ გვერდზე</a></div>
</section></main>
<script>
(function(){
'use strict';
const URL='https://mkxkqdvtmfbxmldnvsef.supabase.co';
const KEY='sb_publishable_K5orPxr9E0q9-K0dKYdt-g_0GTFvWtd';
const STORAGE='sb-mkxkqdvtmfbxmldnvsef-auth-token';
const LEGACY_STORAGE='ecomax-auth';
const $=id=>document.getElementById(id),msg=$('msg'),btn=$('loginBtn');
const redirect=new URLSearchParams(location.search).get('redirect');
if(redirect==='checkout.html') $('registerLink').href='register.html?redirect=checkout.html';
function show(text,type){msg.textContent=text;msg.className='msg show '+(type||'error')}
function client(){
 try{
  if(!localStorage.getItem(STORAGE) && localStorage.getItem(LEGACY_STORAGE)) localStorage.setItem(STORAGE,localStorage.getItem(LEGACY_STORAGE));
 }catch(_){}
 if(window.ECOMAX_SUPABASE_CLIENT?.auth)return window.ECOMAX_SUPABASE_CLIENT;
 if(!window.supabase?.createClient)throw new Error('Supabase ვერ ჩაიტვირთა. გვერდი განაახლე და ისევ სცადე.');
 return window.supabase.createClient(URL,KEY,{auth:{storageKey:STORAGE,storage:window.localStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
}
async function finishSession(db,session){
 if(!session?.access_token||!session?.refresh_token)throw new Error('სესია ვერ შეიქმნა.');
 const r=await db.auth.setSession({access_token:session.access_token,refresh_token:session.refresh_token});
 if(r.error)throw r.error;
 try{sessionStorage.setItem('ecomax-auth-bridge-v1',JSON.stringify({access_token:r.data.session.access_token,refresh_token:r.data.session.refresh_token}))}catch(_){}
 return r.data.session;
}
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();if(btn.disabled)return;
 const email=$('email').value.trim().toLowerCase(),password=$('password').value;
 if(!email||!password){show('შეავსე ორივე ველი.');return}
 btn.disabled=true;btn.textContent='მიმდინარეობს...';
 try{
  const db=client(),r=await db.auth.signInWithPassword({email,password});
  if(r.error)throw r.error;
  await finishSession(db,r.data.session);
  show('ავტორიზაცია წარმატებულია.','success');
  setTimeout(()=>{
   const role=String(r.data.user?.app_metadata?.role||'').toLowerCase();
   if(role==='courier'){location.replace('line.html');return}
   location.replace(redirect==='checkout.html'?'checkout.html':'account.html');
  },250);
 }catch(e){show(e?.message||'ავტორიზაცია ვერ შესრულდა.');btn.disabled=false;btn.textContent='შესვლა'}
});
$('forgot').addEventListener('click',async e=>{
 e.preventDefault();const email=$('email').value.trim().toLowerCase();
 if(!email){show('ჯერ შეიყვანე ელფოსტა.');return}
 try{
  const db=client(),r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/login.html'});
  if(r.error)throw r.error;show('პაროლის აღდგენის ბმული გაიგზავნა.','success');
 }catch(e){show(e?.message||'პაროლის აღდგენა ვერ შესრულდა.')}
});
})();
</script>
</body>
</html>
