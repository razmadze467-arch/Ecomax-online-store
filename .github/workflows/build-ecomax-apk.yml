name: Build ECOMAX APK

on:
  push:
    branches: ["main"]
    paths:
      - "ecomax-android/**"
      - ".github/workflows/build-ecomax-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecomax-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECOMAX-APK
          path: ecomax-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
