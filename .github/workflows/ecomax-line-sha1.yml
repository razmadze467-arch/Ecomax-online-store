name: ECOMAX LINE SHA-1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  signing-report:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Print SHA-1
        run: |
          echo "========================================"
          echo "ECOMAX LINE DEBUG SHA-1"
          echo "========================================"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E "Alias name:|SHA1:|SHA-1:"
          echo "========================================"