name: ECOMAX LINE SHA-1

on:
  push:
    branches: [ main ]

jobs:
  signing-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecomax-line-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Get SHA-1
        run: gradle :app:signingReport --no-daemon