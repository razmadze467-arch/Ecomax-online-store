name: Validate ECOMAX
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          p=HTMLParser()
          p.feed(open('index.html',encoding='utf-8').read())
          p.close()
          print("HTML parsed")
          PY
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,x in enumerate(scripts):
              open(f'/tmp/script{i}.js','w',encoding='utf-8').write(x)
          print("scripts:",len(scripts))
          PY
          for f in /tmp/script*.js; do node --check "$f"; done