<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECOMAX Auth Check</title>
<style>
body{font-family:Arial,sans-serif;background:#05080d;color:#fff;padding:24px}
.box{max-width:760px;margin:auto;background:#0d151f;border:1px solid #243341;border-radius:16px;padding:20px}
h1{color:#28e7ff}pre{white-space:pre-wrap;background:#05080d;padding:15px;border-radius:10px;color:#9ff}
button{padding:12px 18px;border:0;border-radius:10px;background:#28e7ff;font-weight:700;margin:4px}
.small{color:#9db2c0;line-height:1.6}
</style>
</head>
<body>
<div class="box">
<h1>ECOMAX AUTH CHECK</h1>
<p class="small">ეს შემოწმება იყენებს ზუსტად იმავე Supabase კლიენტს და <b>ecomax-auth</b> storage-ს, რომელსაც მთავარი გვერდი იყენებს. Access/refresh token-ები ეკრანზე არ გამოჩნდება.</p>
<button id="check">შემოწმება</button>
<button id="clear">მხოლოდ გვერდის reload</button>
<pre id="out">მზადაა...</pre>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20260927-3"></script>
<script>
const out=document.getElementById('out');

async function run(){
  const result={
    origin:location.origin,
    path:location.pathname,
    sdk:!!(window.supabase&&typeof window.supabase.createClient==='function'),
    wrapperClient:!!window.ECOMAX_SUPABASE_CLIENT,
    authReady:false,
    getSession:false,
    user:false,
    email:null,
    localStorageKey:false,
    localStorageKeyLength:0,
    bridgeKey:false,
    bridgeKeyLength:0,
    authenticatedFlag:document.documentElement.dataset.ecomaxAuthenticated||null,
    authReadyFlag:document.documentElement.dataset.ecomaxAuthReady||null,
    error:null
  };

  try{
    result.localStorageKey=!!localStorage.getItem('ecomax-auth');
    result.localStorageKeyLength=(localStorage.getItem('ecomax-auth')||'').length;
  }catch(e){result.error='localStorage: '+(e?.message||e)}

  try{
    result.bridgeKey=!!sessionStorage.getItem('ecomax-auth-bridge-v1');
    result.bridgeKeyLength=(sessionStorage.getItem('ecomax-auth-bridge-v1')||'').length;
  }catch(e){result.error='sessionStorage: '+(e?.message||e)}

  try{
    const db=window.ECOMAX_AUTH_READY
      ? await window.ECOMAX_AUTH_READY
      : window.ECOMAX_SUPABASE_CLIENT;
    result.authReady=!!db?.auth;
    if(db?.auth){
      const r=await db.auth.getSession();
      result.getSession=!!r?.data?.session;
      result.user=!!r?.data?.session?.user;
      result.email=r?.data?.session?.user?.email||null;
    }
  }catch(e){result.error='session: '+(e?.message||e)}

  out.textContent=JSON.stringify(result,null,2);
}

document.getElementById('check').onclick=run;
document.getElementById('clear').onclick=()=>location.reload();
setTimeout(run,1200);
</script>
</body>
</html>
