<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECOMAX Auth Check</title><style>body{font-family:Arial,sans-serif;background:#05080d;color:#fff;padding:24px}h1{color:#28e7ff}.box{max-width:700px;margin:auto;background:#0d151f;border:1px solid #243341;border-radius:16px;padding:20px}pre{white-space:pre-wrap;background:#05080d;padding:15px;border-radius:10px;color:#9ff}button{padding:12px 18px;border:0;border-radius:10px;background:#28e7ff;font-weight:700}</style></head><body><div class="box"><h1>ECOMAX AUTH CHECK</h1><p>ეს გვერდი აჩვენებს მხოლოდ Session-ის მდგომარეობას — პაროლებსა და Token-ებს არ აჩვენებს.</p><button id="check">შემოწმება</button><pre id="out">მზადაა...</pre></div><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260914-8"></script><script>const out=document.getElementById('out');async function run(){const sdk=!!(window.supabase&&typeof window.supabase.createClient==='function');const c=window.ECOMAX_SUPABASE_CLIENT;if(!c){out.textContent=JSON.stringify({origin:location.origin,path:location.pathname,supabaseSDK:sdk,client:false,loaderError:window.ECOMAX_SUPABASE_ERROR||null},null,2);return}try{const r=await c.auth.getSession();const s=r.data&&r.data.session;out.textContent=JSON.stringify({origin:location.origin,path:location.pathname,supabaseSDK:sdk,client:true,session:!!s,user:!!(s&&s.user),email:s&&s.user?s.user.email:null,sharedStorage:!!localStorage.getItem('ecomax-auth'),legacyStorage:!!localStorage.getItem('sb-mkxkqdvtmfbxmldnvsef-auth-token'),error:r.error?r.error.message:null},null,2)}catch(e){out.textContent='ERROR: '+(e&&e.message||e)}}document.getElementById('check').onclick=run;setTimeout(run,1500);</script></body></html>
