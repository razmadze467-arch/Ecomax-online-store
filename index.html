<!doctype html>
<html lang="ka">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECOMAX — Auto Care</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#02070c;color:#f4fbff;font-family:Arial,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#00eaff22 1px,transparent 1px),linear-gradient(90deg,#00eaff22 1px,transparent 1px);background-size:44px 44px;z-index:-2}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 20%,#00445666,transparent 28%),radial-gradient(circle at 80% 70%,#39006455,transparent 30%);z-index:-3}header{height:68px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 6%;border-bottom:1px solid #00eaff33;background:#02070cdd;backdrop-filter:blur(16px)}.logo{font-size:25px;font-weight:900;letter-spacing:5px;color:#00eaff;text-shadow:0 0 12px #00eaff}.nav{display:flex;gap:25px}.nav a{color:#cfeaf0;text-decoration:none;font-size:14px}.nav a:hover{color:#00eaff}.hero{max-width:1200px;min-height:650px;margin:auto;padding:65px 6%;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:30px}.tag{color:#00eaff;letter-spacing:4px;font-size:12px;font-weight:bold;margin-bottom:18px}.hero h1{font-size:clamp(48px,7vw,86px);line-height:.9;margin:0}.hero h1 span{color:#00eaff;text-shadow:0 0 30px #00eaff}.hero p{max-width:650px;color:#a8bcc4;font-size:18px;line-height:1.7}.cta{display:inline-block;margin-top:18px;padding:14px 22px;border:1px solid #00eaff;border-radius:10px;color:#00eaff;text-decoration:none;background:#00eaff10;box-shadow:0 0 25px #00eaff33}.cta:hover{background:#00eaff;color:#001017}.robot-zone{height:380px;display:grid;place-items:center}.robot{width:235px;height:235px;border:2px solid #00eaff;border-radius:45%;position:relative;background:radial-gradient(circle at 50% 30%,#123e4c,#03090e 65%);box-shadow:0 0 25px #00eaff,0 0 80px #00eaff55,inset 0 0 45px #00eaff22;animation:float 3s ease-in-out infinite}.robot:before{content:"";position:absolute;left:50%;top:-36px;width:2px;height:36px;background:#00eaff;box-shadow:0 0 14px #00eaff}.robot:after{content:"";position:absolute;left:calc(50% - 5px);top:-44px;width:10px;height:10px;border-radius:50%;background:#9d5cff;box-shadow:0 0 22px #9d5cff}.eyes{display:flex;justify-content:center;gap:36px;margin-top:76px}.eye{width:29px;height:18px;border-radius:50%;background:#00eaff;box-shadow:0 0 20px #00eaff;animation:blink 4s infinite}.eye:last-child{background:#9d5cff;box-shadow:0 0 20px #9d5cff}.mouth{position:absolute;left:calc(50% - 38px);top:130px;width:76px;height:22px;border-bottom:2px solid #00eaff}.section{max-width:1200px;margin:auto;padding:70px 6%}.title{text-align:center;margin-bottom:35px}.title h2{font-size:40px;margin:0 0 8px}.title p{color:#7f99a3}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{min-height:190px;padding:19px;border:1px solid #00eaff33;border-radius:15px;background:#061018dd;transition:.25s}.card:hover{transform:translateY(-5px);border-color:#00eaff;box-shadow:0 0 25px #00eaff22}.card h3{color:#00eaff;font-size:16px;margin:0 0 10px}.card p{color:#9fb2b9;font-size:13px;line-height:1.5;min-height:42px}.price{font-weight:bold;margin:13px 0;color:#fff}.select{display:inline-block;border:1px solid #00eaff55;border-radius:8px;padding:8px 10px;color:#bdf5ff;text-decoration:none;font-size:12px}.select:hover{background:#00eaff;color:#001017}footer{text-align:center;padding:45px 20px;color:#5f7780;border-top:1px solid #00eaff22}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes pulse{50%{box-shadow:0 0 30px #00eaff,0 0 65px #00eaff88}}@keyframes blink{0%,45%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}@media(max-width:900px){.hero{grid-template-columns:1fr;text-align:center}.hero p{margin-left:auto;margin-right:auto}.robot-zone{height:300px}.grid{grid-template-columns:repeat(2,1fr)}.nav{display:none}}@media(max-width:600px){header{padding:0 15px}.hero{padding:45px 15px;min-height:570px}.hero h1{font-size:52px}.hero p{font-size:15px}.section{padding:55px 15px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">ECOMAX</div><nav class="nav"><a href="#home">მთავარი</a><a href="#products">პროდუქტები</a></nav></header>
<section class="hero" id="home"><div><div class="tag">AUTO CARE SYSTEM</div><h1>DRIVE<br>THE <span>FUTURE.</span></h1><p>ECOMAX — თანამედროვე ავტოქიმია მანქანის სისუფთავისა და მოვლისთვის.</p><a class="cta" href="#products">პროდუქტების ნახვა</a></div><div class="robot-zone"><div class="robot"><div class="eyes"><i class="eye"></i><i class="eye"></i></div><div class="mouth"></div></div></div></section>
<section class="section" id="products"><div class="title"><h2>ECOMAX PRODUCTS</h2><p>სისუფთავე. ძალა. ბრწყინვალება.</p></div><div class="grid" id="grid"></div></section>
<footer>ECOMAX FUTURE GRID · CLEAN / POWER / SHINE / CARE · DRIVE THE FUTURE.</footer>
<script>
const products=[['ძრავის ქიმწმენდა','ძრავის ზედაპირზე დაგროვილი ჭუჭყის გასაწმენდად'],['დისკების საწმენდი','მუხრუჭის მტვრისა და ჭუჭყის მოსაშორებლად'],['ჟანგის მოსაშორებელი','ჟანგიანი ზედაპირების დასამუშავებლად'],['რადიატორის სარეცხი','რადიატორის სისტემის გასაწმენდად'],['ტორპედოს საპრიალებელი','ტორპედოს სისუფთავისა და ბზინვარებისთვის'],['ტყავის ქიმწმენდა','ტყავის ზედაპირის ნაზი წმენდისთვის'],['ტყავის მკვებავი','გამომშრალი ტყავის მოსავლელად'],['საბურავის საპრიალებელი','საბურავისთვის სუფთა და მოვლილი იერისთვის'],['პლასტმასების საშავებელი','გარე პლასტმასების ფერის გასაახლებლად'],['წებოს/სკოჩის მოსაშორებელი','წებოსა და სკოჩის კვალის მოსაშორებლად'],['ძლიერი ჩამჯდარი ჭუჭყის მოსაშორებელი','ძლიერი ჩამჯდარი ჭუჭყის გასაწმენდად'],['მანქანის სუნამო','სასიამოვნო სურნელისთვის მანქანის სალონში']];
document.getElementById('grid').innerHTML=products.map(p=>`<article class="card"><h3>${p[0]}</h3><p>${p[1]}</p><div class="price">500 მლ — 5₾ · 1 ლ — 10₾ · 5 ლ — 40₾</div><a class="select" href="javascript:quick('მინდა ${p[0]}')">არჩევა</a></article>`).join('');
</script>
