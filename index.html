 box.innerHTML=ids.map(id=>{const p=products.find(x=>x.id==id),q=cart[id],subtotal=q*5;total+=subtotal;return '<div class="cart-row"><div><b>'+p.name+'</b><br><small style="color:#8199a2">500 მლ · '+q+' ც.</small></div><div class="qty"><button onclick="changeQty('+id+',-1)">−</button><span>'+q+'</span><button onclick="changeQty('+id+',1)">+</button></div><b>'+subtotal+'₾</b></div>'}).join('');
