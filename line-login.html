<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ECOMAX LINE — Courier Login</title>
<style>
:root{--bg:#02060a;--card:#08131d;--cyan:#19e6ff;--blue:#4aa8ff;--red:#ff647d;--muted:#8da5b0;--text:#effcff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--text);background:var(--bg)}
body{display:grid;place-items:center;padding:20px;overflow:hidden;background:radial-gradient(circle at 20% 15%,#063845 0,transparent 34%),radial-gradient(circle at 85% 80%,#171044 0,transparent 35%),#02060a}
body:before,body:after{content:"";position:fixed;pointer-events:none;border:1px solid #19e6ff18;border-radius:50%;width:420px;height:420px;animation:spin 18s linear infinite}
body:after{width:650px;height:650px;animation-direction:reverse;animation-duration:28s}
@keyframes spin{to{transform:rotate(360deg)}}
.card{position:relative;width:min(440px,100%);padding:30px;border:1px solid #19e6ff35;border-radius:25px;background:linear-gradient(145deg,#0c1b27eF,#050b11F2);box-shadow:0 30px 100px #000b,0 0 45px #19e6ff0d;backdrop-filter:blur(18px)}
.logo{text-align:center;color:var(--cyan);font-weight:1000;letter-spacing:6px;font-size:27px;text-shadow:0 0 20px #19e6ff66}.line{text-align:center;color:#819aa5;font-size:10px;letter-spacing:3px;margin-top:7px}
.icon{width:78px;height:78px;margin:22px auto 18px;border-radius:22px;display:grid;place-items:center;border:1px solid #19e6ff45;background:#071922;box-shadow:0 0 35px #19e6ff18;font-size:35px}
h1{text-align:center;font-size:27px;margin:0 0 8px}.desc{text-align:center;color:var(--muted);font-size:12px;line-height:1.7;margin:0 0 24px}
label{display:block;color:#9bb0b9;font-size:10px;margin:14px 0 7px;font-weight:800;letter-spacing:.5px}
input{width:100%;height:50px;border-radius:12px;border:1px solid #ffffff18;background:#040b11;color:#fff;padding:0 14px;outline:none;font-size:14px}input:focus{border-color:#19e6ff88;box-shadow:0 0 18px #19e6ff18}
button{width:100%;height:50px;margin-top:19px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#001016;font-weight:1000;cursor:pointer;box-shadow:0 10px 30px #19e6ff18}button:disabled{opacity:.55;cursor:wait}
.error{display:none;margin-top:14px;padding:12px;border-radius:11px;border:1px solid #ff647d38;background:#190a0e;color:#ffabb8;font-size:11px;line-height:1.55}.back{display:block;text-align:center;margin-top:18px;color:#8da5b0;text-decoration:none;font-size:11px}.back:hover{color:var(--cyan)}
.hint{text-align:center;color:#58707a;font-size:9px;margin-top:18px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20260920-1"></script>
</head>
<body>
<main class="card">
<div class="logo">ECOMAX</div><div class="line">LINE • COURIER ACCESS</div>
<div class="icon">🚚</div>
<h1>კურიერის შესვლა</h1>
<p class="desc">ECOMAX LINE-ის სამუშაო სივრცეში შესასვლელად გამოიყენე კურიერის ანგარიში.</p>
<form id="form">
<label>ელფოსტა</label><input id="email" type="email" autocomplete="username" required placeholder="courier@example.com">
<label>პაროლი</label><input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
<button id="submit" type="submit">შესვლა ECOMAX LINE-ში</button>
</form>
<div id="error" class="error"></div>
<a class="back" href="line-register.html">📝 ახალი კურიერის ანგარიში — რეგისტრაცია</a><a class="back" href="/">← მთავარ გვერდზე</a>
<div class="hint">ECOMAX LINE • SECURE DELIVERY CONTROL</div>
</main>
<script>
(async function(){
const db=window.ECOMAX_SUPABASE_CLIENT;
const form=document.getElementById('form'),btn=document.getElementById('submit'),err=document.getElementById('error');
function show(t){err.textContent=t;err.style.display='block'}
if(!db){show('Supabase ვერ ჩაიტვირთა. გვერდი განაახლე.');return}
const {data:{session}}=await db.auth.getSession();
if(session){const u=session.user,role=u?.app_metadata?.role;const ok=role==='courier'||role==='admin'||String(u?.email||'').toLowerCase()==='datogringo@gmail.com';if(ok){location.replace('line.html');return}await db.auth.signOut();}
form.addEventListener('submit',async e=>{
 e.preventDefault(); err.style.display='none'; btn.disabled=true; btn.textContent='მოწმდება...';
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){show('შესვლა ვერ მოხერხდა: '+error.message);btn.disabled=false;btn.textContent='შესვლა ECOMAX LINE-ში';return}
 const u=data.user;
 const role=u?.app_metadata?.role;
 const isAdmin=u?.app_metadata?.role==='admin' || String(u?.email||'').toLowerCase()==='datogringo@gmail.com';
 if(!isAdmin && role!=='courier'){
   await db.auth.signOut();
   show('ეს ანგარიში ECOMAX LINE-ის კურიერად არ არის ავტორიზებული.');
   btn.disabled=false;btn.textContent='შესვლა ECOMAX LINE-ში';return;
 }
 location.replace('line.html');
});
})();
</script>
</body>
</html>
