<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ECOMAX — რეგისტრაცია</title>
<style>
:root{--bg:#04080d;--card:#0a131d;--line:#17303d;--text:#eefaff;--muted:#8ea3ae;--cyan:#19e6ff;--cyan2:#48a9ff;--red:#ff647d;--green:#45e3a3}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 10%,#083746 0,transparent 32%),radial-gradient(circle at 85% 25%,#21134c 0,transparent 35%),var(--bg)}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.wrap{width:min(100%,1050px);display:grid;grid-template-columns:1fr 440px;gap:55px;align-items:center}.intro{padding:20px}.brand{font-weight:900;letter-spacing:5px;color:var(--cyan);font-size:26px;text-shadow:0 0 25px #19e6ff55}.tag{margin-top:55px;color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:2px}.intro h1{font-size:clamp(42px,6vw,72px);line-height:1;margin:15px 0;letter-spacing:-3px}.intro h1 span{color:var(--cyan)}.intro p{max-width:560px;color:var(--muted);line-height:1.8;font-size:14px}.card{background:linear-gradient(145deg,#0e1b27f5,#060c12f8);border:1px solid #ffffff14;border-radius:24px;padding:30px;box-shadow:0 25px 80px #0008}.card h2{font-size:27px;margin:7px 0}.label{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:2px}.sub{color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:24px}.field{margin:14px 0}.field label{display:block;color:#c9d7dd;font-size:11px;margin-bottom:7px}.field input{width:100%;height:52px;border:1px solid #ffffff14;border-radius:12px;background:#03070bcc;color:var(--text);padding:0 14px;font-size:16px;outline:0}.field input:focus{border-color:#19e6ff77;box-shadow:0 0 0 3px #19e6ff12}.terms{display:flex;gap:9px;align-items:flex-start;color:var(--muted);font-size:11px;line-height:1.5;margin:18px 0}.terms input{width:16px;height:16px;flex:0 0 16px;margin-top:1px;accent-color:var(--cyan)}a{color:var(--cyan);text-decoration:none}.btn{width:100%;height:52px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#001015;font-weight:900;font-size:15px;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.msg{display:none;padding:12px;border-radius:11px;font-size:11px;line-height:1.6;margin-bottom:14px}.msg.show{display:block}.msg.error{background:#ff647d10;border:1px solid #ff647d35;color:#ffb4c0}.msg.success{background:#45e3a310;border:1px solid #45e3a335;color:#a7f1d1}.foot{text-align:center;color:#687983;font-size:11px;margin-top:20px}.back{display:inline-block;margin-top:18px;color:#9fb0b8;font-size:11px}@media(max-width:820px){body{padding:14px}.wrap{grid-template-columns:1fr;gap:18px}.intro{padding:8px;text-align:center}.tag{margin-top:25px}.intro p{margin:auto}.card{padding:22px}.intro h1{font-size:42px}}@media(max-width:430px){.card{padding:18px;border-radius:18px}.intro h1{font-size:36px;letter-spacing:-2px}.brand{font-size:21px}}
</style>
</head>
<body>
<main class="wrap">
<section class="intro"><div class="brand">ECOMAX</div><div class="tag">PROFESSIONAL AUTO CARE</div><h1>შექმენი შენი <span>ანგარიში.</span></h1><p>რეგისტრაცია მუშაობს ერთ ფორმაზე და ერთ Supabase სესიაზე — ტელეფონზეც და კომპიუტერზეც.</p></section>
<section class="card">
<div class="label">ECOMAX ACCOUNT</div><h2>რეგისტრაცია</h2><div class="sub">შექმენი ანგარიში ელფოსტით და უსაფრთხო პაროლით.</div>
<div id="msg" class="msg"></div>
<form id="registerForm" novalidate>
<div class="field"><label for="email">ელფოსტა</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required></div>
<div class="field"><label for="password">პაროლი</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required></div>
<div class="field"><label for="confirm">გაიმეორე პაროლი</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="6" required></div>
<label class="terms"><input id="terms" type="checkbox" required><span>ვეთანხმები ანგარიშის გამოყენების წესებს.</span></label>
<button class="btn" id="registerBtn" type="submit">ანგარიშის შექმნა</button>
</form>
<div class="foot">უკვე გაქვს ანგარიში? <a href="login.html">შესვლა</a><br><a class="back" href="index.html">← მთავარ გვერდზე</a></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL="https://mkxkqdvtmfbxmldnvsef.supabase.co",KEY="sb_publishable_K5orPxr9E0q9-k0dKYdt-g_0GTFvWtd";
const client=window.supabase.createClient(URL,KEY,{auth:{storageKey:"ecomax-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
window.ECOMAX_SUPABASE_CLIENT=client;window.ECOMAX_AUTH_CLIENT=client;
const $=id=>document.getElementById(id),msg=$("msg"),btn=$("registerBtn");
function show(text,type="error"){msg.textContent=text;msg.className="msg show "+type}
(async()=>{try{const {data}=await client.auth.getSession();if(data.session)location.replace("account.html")}catch(e){}})();
$("registerForm").addEventListener("submit",async e=>{e.preventDefault();if(btn.disabled)return;const email=$("email").value.trim(),password=$("password").value,confirm=$("confirm").value;if(!email||!password||!confirm){show("შეავსე ყველა ველი.");return}if(password.length<6){show("პაროლი უნდა იყოს მინიმუმ 6 სიმბოლო.");return}if(password!==confirm){show("პაროლები ერთმანეთს არ ემთხვევა.");return}if(!$("terms").checked){show("მონიშნე თანხმობა.");return}btn.disabled=true;btn.textContent="იქმნება...";try{const {data,error}=await client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+"/account.html"}});if(error)throw error;if(data.session){show("ანგარიში შეიქმნა.","success");setTimeout(()=>location.replace("account.html"),250)}else{show("რეგისტრაცია დასრულდა. დაადასტურე ელფოსტა, შემდეგ შედი ანგარიშში.","success");btn.textContent="ელფოსტის დადასტურებას ველოდები"}}catch(err){show(err?.message||"რეგისტრაცია ვერ შესრულდა.");btn.disabled=false;btn.textContent="ანგარიშის შექმნა"}});
</script>
</body></html>
