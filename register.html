<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ECOMAX — რეგისტრაცია</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Georgia,"Times New Roman",Arial,sans-serif;color:#f5f9fb;background:#02080c;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 18% 18%,rgba(25,230,255,.18),transparent 28%),radial-gradient(circle at 84% 72%,rgba(0,167,207,.12),transparent 30%),linear-gradient(135deg,#031118,#020609 55%,#031016);z-index:-2}.glow{position:fixed;width:420px;height:420px;border-radius:50%;right:-140px;top:-150px;background:radial-gradient(circle,rgba(25,230,255,.22),transparent 68%);filter:blur(8px);z-index:-1}.box{width:100%;max-width:480px;padding:42px;border-radius:26px;background:linear-gradient(145deg,rgba(9,22,29,.97),rgba(3,10,15,.98));border:1px solid rgba(25,230,255,.22);box-shadow:0 30px 90px rgba(0,0,0,.62),inset 0 1px rgba(255,255,255,.04);position:relative}.box:before{content:"";position:absolute;inset:0;border-radius:26px;background:linear-gradient(120deg,rgba(25,230,255,.06),transparent 35%);pointer-events:none}.logo{text-align:center;font-family:Arial,sans-serif;font-size:30px;font-weight:900;letter-spacing:6px;margin-bottom:7px}.logo span{color:#19e6ff;text-shadow:0 0 22px rgba(25,230,255,.9)}.title{text-align:center;font-size:27px;font-weight:700;margin-top:20px}.sub{text-align:center;color:#91a9b2;margin:9px 0 30px;font-size:14px}.field{margin-bottom:17px}label{display:block;color:#c6d3d8;font-size:14px;margin-bottom:8px}input{width:100%;padding:15px 16px;border-radius:12px;border:1px solid #29444f;background:rgba(3,12,18,.86);color:#fff;font-size:15px;outline:none;transition:.2s}input::placeholder{color:#627983}input:focus{border-color:#19e6ff;box-shadow:0 0 0 3px rgba(25,230,255,.08),0 0 20px rgba(25,230,255,.08)}button{width:100%;padding:16px;border:0;border-radius:12px;background:linear-gradient(135deg,#19e6ff,#0bc4e0);color:#001116;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 25px rgba(25,230,255,.18);transition:.2s}button:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(25,230,255,.25)}button:disabled{opacity:.55;cursor:wait;transform:none}.forgot{text-align:right;margin:-4px 0 16px}.forgot a,.links a{color:#19e6ff;text-decoration:none}.message{display:none;margin-top:18px;padding:14px;border-radius:12px;line-height:1.5;font-size:14px}.success{display:block;color:#8af3cb;background:rgba(35,190,130,.09);border:1px solid #238e68}.error{display:block;color:#ffadb6;background:rgba(255,70,90,.09);border:1px solid #9b3341}.links{text-align:center;margin-top:24px;color:#8fa5af}.home{display:block;text-align:center;margin-top:17px;color:#738a94;text-decoration:none;font-size:14px}.home:hover{color:#19e6ff}@media(max-width:520px){.box{padding:30px 22px;border-radius:20px}.title{font-size:24px}}</style>
</head>
<body><div class="glow"></div>
<div class="box">
<div class="logo"><span>✦</span> ECOMAX</div>
<div class="title">ანგარიშის შექმნა</div>
<div class="sub">შექმენი ECOMAX-ის მომხმარებლის ანგარიში</div>
<form id="registerForm">
<div class="field"><label>სახელი და გვარი</label><input id="name" type="text" required></div>
<div class="field"><label>ტელეფონი</label><input id="phone" type="tel" required></div>
<div class="field"><label>მისამართი</label><input id="address" type="text" required></div>
<div class="field"><label>ელფოსტა</label><input id="email" type="email" required></div>
<div class="field"><label>პაროლი</label><input id="password" type="password" minlength="6" required></div>
<div class="field"><label>გაიმეორე პაროლი</label><input id="password2" type="password" minlength="6" required></div>
<button id="registerButton" class="register" type="submit">ანგარიშის შექმნა</button>
</form>
<div id="message" class="message"></div>
<div class="links">უკვე გაქვს ანგარიში? <a href="login.html">ავტორიზაცია</a></div>
<a href="index.html" class="home">← მთავარ გვერდზე დაბრუნება</a>
</div>
<script>
const SUPABASE_URL="https://mkxkqdvtmfbxmldnvsef.supabase.co";
const SUPABASE_KEY="sb_publishable_K5orPxr9E0q9-K0dKYdt-g_0GTFvWtd";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function show(text,type){const el=document.getElementById("message");el.textContent=text;el.className="message "+type}
document.getElementById("registerForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const button=document.getElementById("registerButton");
 const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim(),email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,password2=document.getElementById("password2").value;
 if(password!==password2){show("პაროლები ერთმანეთს არ ემთხვევა.","error");return}
 if(password.length<6){show("პაროლი უნდა შეიცავდეს მინიმუმ 6 სიმბოლოს.","error");return}
 button.disabled=true;button.textContent="ანგარიში იქმნება...";
 try{
  const {data,error}=await client.auth.signUp({email,password,options:{data:{full_name:name,phone,address},emailRedirectTo:window.location.origin+"/"}});
  if(error)throw error;
  if(!data.user)throw new Error("მომხმარებელი ვერ შეიქმნა.");
  if(data.session){
   const {error:pe}=await client.from("profiles").upsert({id:data.user.id,full_name:name,phone,address,city:"ქუთაისი",updated_at:new Date().toISOString()});
   if(pe)console.error(pe);
   show("რეგისტრაცია წარმატებით დასრულდა! გადამისამართება...","success");
   setTimeout(()=>location.href="index.html",900);
  }else{
   show("ანგარიში შეიქმნა! 📧 შეამოწმე ელფოსტა და დაადასტურე ანგარიში.","success");
   button.disabled=false;button.textContent="ანგარიშის შექმნა";
  }
 }catch(err){
  console.error(err);
  let msg=err.message||"რეგისტრაცია ვერ შესრულდა.";
  if(/already registered/i.test(msg))msg="ეს ელფოსტა უკვე რეგისტრირებულია.";
  else if(/password/i.test(msg))msg="პაროლი უნდა შეიცავდეს მინიმუმ 6 სიმბოლოს.";
  show(msg,"error");button.disabled=false;button.textContent="ანგარიშის შექმნა";
 }
});
</script>
</body>
</html>
