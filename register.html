@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#02070b;color:#fff;font-family:"Noto Sans Georgian",sans-serif;overflow:hidden}body:before{content:"";position:fixed;inset:-20%;background:linear-gradient(90deg,transparent 49.8%,rgba(25,230,255,.12) 50%,transparent 50.2%),linear-gradient(0deg,transparent 49.8%,rgba(25,230,255,.1) 50%,transparent 50.2%);background-size:80px 80px;transform:perspective(600px) rotateX(60deg) translateY(18%);opacity:.3}.scene{width:min(470px,calc(100% - 28px));perspective:1200px}.card{padding:40px;border-radius:26px;background:linear-gradient(145deg,rgba(9,24,31,.96),rgba(2,9,14,.98));border:1px solid rgba(25,230,255,.28);box-shadow:0 35px 100px #000,0 0 45px rgba(25,230,255,.08);transform:rotateX(2deg) rotateY(-2deg);position:relative}.card:after{content:"";position:absolute;inset:10px;border:1px solid rgba(25,230,255,.08);border-radius:19px;pointer-events:none}.logo{text-align:center;font:bold 30px Arial;letter-spacing:6px}.logo i{color:#19e6ff;font-style:normal;text-shadow:0 0 25px #19e6ff}.orb{width:78px;height:78px;margin:22px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 3%,#28eaff 9%,#087d95 35%,#03151b 70%);box-shadow:0 0 30px rgba(25,230,255,.7),0 0 80px rgba(25,230,255,.16)}h1{text-align:center;font-size:25px;margin:4px 0 7px}.sub{text-align:center;color:#8da7b1;font-size:13px;margin-bottom:27px}.field{margin:15px 0}label{display:block;font-size:13px;color:#bfd0d5;margin-bottom:7px}input{width:100%;padding:14px;border-radius:11px;border:1px solid #20424e;background:#030c12;color:#fff;outline:0;font:inherit}input:focus{border-color:#19e6ff;box-shadow:0 0 0 3px rgba(25,230,255,.08)}.password{position:relative}.password button{position:absolute;right:7px;top:7px;width:42px;padding:8px;background:#0b2028;color:#a9c5cd;border:1px solid #173b46;border-radius:8px;cursor:pointer}.submit{width:100%;margin-top:9px;padding:15px;border:0;border-radius:11px;background:#19e6ff;color:#001116;font-weight:900;font:inherit;cursor:pointer}.submit:disabled{opacity:.5}.msg{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:13px}.ok{display:block;border:1px solid #248b68;color:#87edc6;background:#082219}.err{display:block;border:1px solid #923643;color:#ffadb7;background:#240b10}.links{text-align:center;color:#8299a2;font-size:13px;margin-top:20px}.links a{color:#19e6ff;text-decoration:none}.home{display:block;text-align:center;color:#6f858e;text-decoration:none;font-size:12px;margin-top:15px}</style></head><body><div class="scene"><div class="card"><div class="logo"><i>✦</i> ECOMAX</div><div class="orb"></div><h1>რეგისტრაცია</h1><div class="sub">შექმენი შენი ECOMAX მომხმარებლის ანგარიში</div><form id="form"><div class="field"><label>სახელი და გვარი</label><input id="name" required placeholder="სახელი და გვარი"></div><div class="field"><label>ტელეფონი</label><input id="phone" type="tel" required placeholder="5XXXXXXXX"></div><div class="field"><label>მისამართი</label><input id="address" required placeholder="მისამართი"></div><div class="field"><label>ელფოსტა</label><input id="email" type="email" autocomplete="email" required placeholder="example@gmail.com"></div><div class="field"><label>პაროლი</label><div class="password"><input id="password" type="password" autocomplete="new-password" required minlength="6" placeholder="მინიმუმ 6 სიმბოლო"><button type="button" onclick="togglePass()">◉</button></div></div><button class="submit" id="btn">ანგარიშის შექმნა</button></form><div id="msg" class="msg"></div><div class="links">უკვე გაქვს ანგარიში? <a href="login.html">ავტორიზაცია</a></div><a class="home" href="index.html">← მთავარ გვერდზე</a></div></div><script>
const db=supabase.createClient("https://mkxkqdvtmfbxmldnvsef.supabase.co","sb_publishable_K5orPxr9E0q9-K0dKYdt-g_0GTFvWtd");const msg=document.getElementById("msg");function show(t,c){msg.textContent=t;msg.className="msg "+c}function togglePass(){const p=document.getElementById("password");p.type=p.type==="password"?"text":"password"}document.getElementById("form").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("btn");if(password.value.length<6){show("პაროლი უნდა შეიცავდეს მინიმუმ 6 სიმბოლოს.","err");return}b.disabled=true;b.textContent="იქმნება...";const {data,error}=await db.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{full_name:name.value.trim(),phone:phone.value.trim(),address:address.value.trim()},emailRedirectTo:window.location.origin+"/"}});if(error){show(/already registered/i.test(error.message)?"ეს ელფოსტა უკვე რეგისტრირებულია.":error.message,"err");b.disabled=false;b.textContent="ანგარიშის შექმნა";return}show(data.session?"რეგისტრაცია წარმატებულია!":"ანგარიში შეიქმნა — შეამოწმე ელფოსტა და დაადასტურე ანგარიში.","ok");if(data.session)setTimeout(()=>location.href="index.html",800)};</script></body></html>
