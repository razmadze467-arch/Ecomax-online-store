<style>
:root{--bg:#04080d;--card:#0a131d;--text:#eefaff;--muted:#8ea3ae;--cyan:#19e6ff;--blue:#48a9ff;--red:#ff647d;--green:#45e3a3}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--text);background:var(--bg)}body{min-height:100vh;padding:0}.bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 15%,#083746 0,transparent 34%),radial-gradient(circle at 85% 25%,#21134c 0,transparent 36%)}header{position:sticky;top:0;z-index:5;border-bottom:1px solid #ffffff12;background:#04080df0}.nav{height:70px;width:min(1100px,calc(100% - 28px));margin:auto;display:flex;align-items:center;gap:20px}.logo{font-weight:900;letter-spacing:5px;color:var(--cyan);font-size:23px}.links{margin-left:auto;display:flex;gap:18px}.links a{color:#aab8c0;text-decoration:none;font-size:12px}.links a:hover{color:var(--cyan)}main{position:relative;z-index:1;width:min(900px,calc(100% - 28px));margin:50px auto}.card{background:linear-gradient(145deg,#0e1b27,#060c12);border:1px solid #19e6ff25;border-radius:24px;padding:32px;box-shadow:0 25px 80px #0009}.eyebrow{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:2px}.card h1{font-size:clamp(34px,6vw,58px);margin:10px 0}.card p{color:var(--muted);line-height:1.7}.email{margin:25px 0;padding:18px;border:1px solid #ffffff12;border-radius:15px;background:#ffffff05}.email small{display:block;color:var(--muted);margin-bottom:6px}.email strong{font-size:16px;word-break:break-word}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:11px;text-decoration:none;font-weight:900;font-size:13px;border:1px solid #ffffff18;background:#ffffff06;color:var(--text);cursor:pointer}.primary{border:0;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#001015}.danger{color:#ff9aaa;border-color:#ff647d35}.msg{margin-top:16px;color:var(--green);font-size:12px}.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}@media(max-width:600px){.nav{height:62px}.links{gap:10px}.links a:nth-child(2){display:none}main{margin:25px auto}.card{padding:22px;border-radius:18px}.actions>*{width:100%}}
.orders-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:35px;padding-top:25px;border-top:1px solid #ffffff12}.orders-head h2{margin:5px 0 0;font-size:22px}.orders{display:grid;gap:14px;margin-top:18px}.order-card{border:1px solid rgba(25,230,255,.15);border-radius:18px;padding:18px;background:linear-gradient(145deg,#0b1823,#050b11);box-shadow:inset 0 0 20px rgba(25,230,255,.025)}.order-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.order-number{font-weight:900;color:#efffff;letter-spacing:.5px}.status{padding:7px 11px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid #ffffff18}.status.new{color:#19e6ff;border-color:#19e6ff45}.status.processing{color:#ffd76a;border-color:#ffd76a45}.status.shipped{color:#b47cff;border-color:#b47cff45}.status.completed{color:#45e3a3;border-color:#45e3a345}.status.cancelled{color:#ff647d;border-color:#ff647d45}.order-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:11px}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:17px}.step{position:relative;text-align:center;color:#607784;font-size:9px}.step:before{content:"";display:block;height:4px;border-radius:5px;background:#ffffff12;margin-bottom:7px}.step.done{color:#19e6ff}.step.done:before{background:linear-gradient(90deg,#19e6ff,#48a9ff);box-shadow:0 0 10px rgba(25,230,255,.35)}.items-mini{margin-top:14px;padding-top:12px;border-top:1px solid #ffffff0d;color:#aabcc4;font-size:11px;line-height:1.8}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #19e6ff25;border-radius:15px}@media(max-width:600px){.orders-head{align-items:flex-start}.timeline{grid-template-columns:1fr 1fr}.order-card{padding:14px}}.eta-box{margin-top:14px;padding:13px 14px;border:1px solid rgba(25,230,255,.16);border-radius:14px;background:rgba(25,230,255,.035)}.eta-box strong{display:block;color:var(--cyan);font-size:11px}.eta-count{margin-top:6px;font-size:16px;font-weight:900}.eta-late{color:var(--red)!important}</style>

body{background-color:#020812!important}

.live-box{margin-top:16px;padding:15px;border:1px solid rgba(0,246,255,.18);border-radius:16px;background:linear-gradient(145deg,rgba(0,246,255,.045),rgba(123,77,255,.025));box-shadow:inset 0 0 22px rgba(0,246,255,.025)}
.live-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.live-title{font-weight:900;color:#00f6ff;font-size:13px}.live-state{font-size:10px;color:#8ea3ae}.live-info{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;color:#b9ccd5;font-size:11px}.live-map{height:230px;margin-top:12px;border-radius:13px;overflow:hidden;border:1px solid rgba(0,246,255,.12);background:#061018}.live-map .leaflet-control-attribution{font-size:8px}.live-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.live-actions a,.live-actions button{min-height:36px;padding:0 12px;border-radius:9px;border:1px solid #ffffff18;background:#ffffff08;color:#eaffff;text-decoration:none;font-weight:800;font-size:10px;cursor:pointer}.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#45e3a3;box-shadow:0 0 10px #45e3a3;margin-right:6px}.live-off{color:#ffb0bd!important}.live-off .live-dot{background:#ff647d;box-shadow:0 0 10px #ff647d}.live-loading{padding:18px;text-align:center;color:#8ea3ae;font-size:11px}@media(max-width:600px){.live-map{height:210px}}

<body><div class="bg"></div>
<header><nav class="nav"><div class="logo">ECOMAX</div><div class="links"><a href="index.html">მთავარი</a><a href="checkout.html">შეკვეთა</a><a href="index.html">პროდუქცია</a></div></nav></header>
<main>
  <div id="loading" class="loading">ანგარიში იტვირთება...</div>

  <section id="account" class="card" hidden>
    <div class="eyebrow">ECOMAX ACCOUNT</div>
    <h1>ჩემი ანგარიში.</h1>
    <p>შენ შესული ხარ ECOMAX ანგარიშში.</p>

    <div class="email">
      <small>ელფოსტა</small>
      <strong id="email"></strong>
    </div>

    <div class="actions">
      <a class="btn primary" href="index.html">მთავარ გვერდზე</a>
      <a class="btn" href="checkout.html">ახალი შეკვეთა</a>
      <button id="logout" class="btn danger" type="button">გამოსვლა</button>
    </div>

    <div id="msg" class="msg"></div>

    <div class="orders-head">
      <div>
        <div class="eyebrow">ORDER CENTER</div>
        <h2>📦 ჩემი შეკვეთები</h2>
      </div>
      <button id="refreshOrders" class="btn" type="button">↻ განახლება</button>
    </div>

    <div id="orders" class="orders">
      <div class="empty">შეკვეთები იტვირთება...</div>
    </div>
  </section>
</main>
<script>
(async function(){
  'use strict';

  const client=window.ECOMAX_SUPABASE_CLIENT||window.ECOMAX_AUTH_CLIENT;
  const loading=document.getElementById('loading');
  const account=document.getElementById('account');
  const email=document.getElementById('email');
  const msg=document.getElementById('msg');
  const ordersEl=document.getElementById('orders');

  const labels={new:'შეკვეთა მიღებულია',processing:'მზადდება',loaded:'ტვირთი დაიტვირთა',picked_up:'კურიერმა აიღო',shipped:'გზაშია',completed:'ჩაბარდა',cancelled:'გაუქმებული'};
  const steps=['new','processing','loaded','picked_up','shipped','completed'];

  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));}
  function money(v){return Number(v||0).toLocaleString('ka-GE',{minimumFractionDigits:0,maximumFractionDigits:2})+' ₾';}
  function date(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('ka-GE');}

  function timeline(status,o){
    if(status==='cancelled') return '<div class="timeline"><div class="step done">გაუქმებული</div></div>';
    const current=Math.max(0,steps.indexOf(status));
    const times={new:o?.created_at,processing:o?.updated_at,loaded:o?.cargo_loaded_at,picked_up:o?.cargo_picked_up_at,shipped:o?.departed_at,completed:o?.delivered_at};
    const names={new:'მიღებულია',processing:'მზადდება',loaded:'დატვირთულია',picked_up:'კურიერთან',shipped:'გზაშია',completed:'ჩაბარდა'};
    return '<div class="timeline">'+steps.map((s,i)=>'<div class="step '+(i<=current?'done ':'')+(i===current?'current':'')+'"><span>'+names[s]+'</span>'+(times[s]?'<small>'+esc(date(times[s]))+'</small>':'')+'</div>').join('')+'</div>';
  }

  function etaBox(o){
    if(!o?.estimated_arrival_at || ['completed','cancelled'].includes(o.status)) return '';
    const t=new Date(o.estimated_arrival_at).getTime();
    if(!Number.isFinite(t)) return '';
    return '<div class="eta-box"><strong>🕐 სავარაუდო ჩამოსვლა</strong><div class="eta-count" data-eta="'+esc(o.estimated_arrival_at)+'">იტვირთება...</div></div>';
  }

  function updateEtaCountdowns(){
    document.querySelectorAll('[data-eta]').forEach(el=>{
      const t=new Date(el.dataset.eta).getTime(), diff=t-Date.now();
      if(!Number.isFinite(t)) return;
      if(diff<=0){el.textContent='მოსალოდნელი დრო უკვე გავიდა';el.classList.add('eta-late');return;}
      const total=Math.floor(diff/1000), h=Math.floor(total/3600), m=Math.floor((total%3600)/60), sec=total%60;
      el.textContent=(h? h+' სთ. ':'')+m+' წთ. '+String(sec).padStart(2,'0')+' წმ.';
    });
  }

  function trackingTimes(o){
    const rows=[];
    if(o.cargo_loaded_at) rows.push('<div>📦 ტვირთი დაიტვირთა: <b>'+esc(date(o.cargo_loaded_at))+'</b></div>');
    if(o.cargo_picked_up_at) rows.push('<div>🚚 კურიერმა ტვირთი აიღო: <b>'+esc(date(o.cargo_picked_up_at))+'</b></div>');
    if(o.departed_at) rows.push('<div>🛣️ გამოსვლის დრო: <b>'+esc(date(o.departed_at))+'</b></div>');
    if(o.arrived_at) rows.push('<div>📍 ადგილზე მისვლა: <b>'+esc(date(o.arrived_at))+'</b></div>');
    if(o.estimated_arrival_at) rows.push('<div>🕐 სავარაუდო ჩამოსვლა: <b>'+esc(date(o.estimated_arrival_at))+'</b></div>');
    if(o.delivered_at) rows.push('<div>✅ ჩაბარების დრო: <b>'+esc(date(o.delivered_at))+'</b></div>');
    return rows.length ? '<div class="items-mini">'+rows.join('')+'</div>' : '';
  }

  function renderOrders(list){
    window.__ECOMAX_ORDER_DATA=Object.fromEntries((list||[]).map(o=>[String(o.order_number||('ECX-'+String(o.id||'').slice(0,8).toUpperCase())),o]));
    if(!list.length){ordersEl.innerHTML='<div class="empty">შეკვეთები ჯერ არ გაქვს.</div>';return;}
    ordersEl.innerHTML=list.map(o=>{
      const items=Array.isArray(o.items)?o.items.map(i=>esc(i.name||i.product_name||'პროდუქტი')+' × '+esc(i.quantity||1)).join(' • '):'';
      const number=o.order_number||('ECX-'+String(o.id||'').slice(0,8).toUpperCase());
      return '<article class="order-card">'+
        '<div class="order-top"><div class="order-number">📦 '+esc(number)+'</div><span class="status '+esc(o.status||'new')+'">'+esc(labels[o.status]||o.status||'ახალი')+'</span></div>'+
        '<div class="order-meta"><span>'+esc(date(o.created_at))+'</span><b>'+money(o.total)+'</b></div>'+
        timeline(o.status||'new',o)+
        (items?'<div class="items-mini">'+items+'</div>':'')+
        trackingTimes(o)+
        etaBox(o)+
        (['completed','cancelled'].includes(o.status)?'':'<div class="live-box" data-live-order="'+esc(o.id)+'"><div class="live-loading">📍 LIVE პოზიცია იტვირთება...</div></div>')+
      '</article>';
    }).join('');
  }


  const liveMaps=new Map();
  let livePollTimer=null;

  function liveStatusText(status){
    return labels[status]||status||'შეკვეთა';
  }

  async function loadDeliveryLive(orderId){
    const box=document.querySelector('[data-live-order="'+CSS.escape(String(orderId))+'"]');
    if(!box||!client) return;
    const {data,error}=await client.rpc('ecomax_customer_get_courier_location',{p_order_id:orderId});
    if(error){box.innerHTML='<div class="live-loading live-off">LIVE პოზიციის ჩატვირთვა ვერ მოხერხდა.</div>';return;}
    const row=Array.isArray(data)?data[0]:data;
    if(!row||!row.courier_id){box.innerHTML='<div class="live-loading">📍 კურიერი ჯერ არ არის მიბმული ამ შეკვეთაზე.</div>';return;}
    if(row.latitude==null||row.longitude==null){
      box.innerHTML='<div class="live-head"><div class="live-title"><span class="live-dot" style="background:#ffd76a;box-shadow:0 0 10px #ffd76a"></span>კურიერის LIVE პოზიცია</div></div><div class="live-loading">📡 კურიერის GPS ჯერ არ არის აქტიური.</div>';
      return;
    }
    const lat=Number(row.latitude),lng=Number(row.longitude);
    if(!Number.isFinite(lat)||!Number.isFinite(lng)) return;
    const mapId='live-map-'+String(orderId).replace(/[^a-zA-Z0-9_-]/g,'');
    box.innerHTML='<div class="live-head"><div class="live-title"><span class="live-dot"></span>📍 კურიერის LIVE პოზიცია</div><div class="live-state">განახლდა: '+esc(date(row.updated_at))+'</div></div>'+
      '<div class="live-info"><span>🚚 '+esc(row.courier_name||'ECOMAX კურიერი')+'</span>'+(row.courier_phone?'<span>📞 '+esc(row.courier_phone)+'</span>':'')+'<span>📦 '+esc(liveStatusText(row.status))+'</span></div>'+
      '<div id="'+mapId+'" class="live-map"></div><div class="live-actions"><a target="_blank" rel="noopener" href="https://www.google.com/maps?q='+encodeURIComponent(lat+','+lng)+'">🗺️ რუკის გახსნა</a><button type="button" data-route="'+esc(orderId)+'">🛣️ მარშრუტი</button></div>';
    const map=L.map(mapId,{zoomControl:true,attributionControl:true}).setView([lat,lng],15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    const icon=L.divIcon({className:'',html:'<div style="width:18px;height:18px;border-radius:50%;background:#00f6ff;border:3px solid #061018;box-shadow:0 0 12px #00f6ff,0 0 25px rgba(0,246,255,.65)"></div>',iconSize:[18,18],iconAnchor:[9,9]});
    const marker=L.marker([lat,lng],{icon}).addTo(map).bindPopup('<b>ECOMAX LINE</b><br>'+esc(row.courier_name||'კურიერი')).openPopup();
    liveMaps.set(String(orderId),{map,marker});
    box.querySelector('[data-route]')?.addEventListener('click',()=>loadDeliveryRoute(orderId,map));
    setTimeout(()=>map.invalidateSize(),120);
  }

  async function loadDeliveryRoute(orderId,map){
    const {data,error}=await client.rpc('ecomax_customer_get_order_route',{p_order_id:orderId});
    if(error||!Array.isArray(data)||data.length<2){msg.textContent='ამ შეკვეთას ჯერ საკმარისი მარშრუტის GPS ისტორია არ აქვს.';return;}
    const points=data.map(x=>[Number(x.latitude),Number(x.longitude)]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));
    if(points.length<2) return;
    if(map.__route) map.removeLayer(map.__route);
    map.__route=L.polyline(points,{color:'#00f6ff',weight:5,opacity:.82,lineJoin:'round',lineCap:'round'}).addTo(map);
    map.fitBounds(map.__route.getBounds(),{padding:[25,25],maxZoom:16});
  }

  async function refreshLiveDelivery(){
    const boxes=[...document.querySelectorAll('[data-live-order]')];
    for(const box of boxes) await loadDeliveryLive(box.dataset.liveOrder);
  }

  async function loadOrders(user){
    ordersEl.innerHTML='<div class="empty">შეკვეთები იტვირთება...</div>';
    const {data,error}=await client.from('orders').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    if(error){console.error('Customer orders:',error);ordersEl.innerHTML='<div class="empty">შეკვეთების ჩატვირთვა ვერ მოხერხდა.<br><small>'+esc(error.message)+'</small></div>';return;}
    const rows=data||[];
    window.__ECOMAX_ORDER_DATA=Object.fromEntries(rows.map(o=>[o.order_number||('ECX-'+String(o.id||'').slice(0,8).toUpperCase()),o]));
    renderOrders(rows);
    setTimeout(refreshLiveDelivery,80);
  }

  try{
    if(window.ECOMAX_AUTH_READY) await window.ECOMAX_AUTH_READY;
    if(!client) throw new Error('Supabase კლიენტი ვერ ჩაიტვირთა.');

    const getSafe = window.ECOMAX_GET_SESSION;
    const session = getSafe
      ? await getSafe(client)
      : (await client.auth.getSession())?.data?.session || null;
    if(!session){location.replace('login.html');return;}

    const user=session.user;
    const role=String(user?.app_metadata?.role||'').toLowerCase();
    if(role==='courier'){ location.replace('index.html'); return; }
    email.textContent=user.email||'';
    loading.hidden=true;
    account.hidden=false;

    await loadOrders(user);
    updateEtaCountdowns();
    const etaTimer=setInterval(updateEtaCountdowns,1000);
    livePollTimer=setInterval(refreshLiveDelivery,10000);

    document.getElementById('refreshOrders').addEventListener('click',()=>loadOrders(user));

    client.auth.onAuthStateChange((event,s)=>{
      if(event==='SIGNED_OUT'||!s) location.replace('login.html');
    });

    document.getElementById('logout').addEventListener('click',async function(){
      this.disabled=true;
      const r=await client.auth.signOut();
      if(r.error){this.disabled=false;msg.textContent=r.error.message;return;}
      location.replace('index.html');
    });

    // სტატუსის ცვლილება ავტომატურად გამოჩნდება დაახლოებით ყოველ 15 წამში.
    let refreshTimer=setInterval(()=>loadOrders(user),5000);
    // Realtime: სტატუსის ცვლილება გამოჩნდება თითქმის მყისიერად.
    const realtime=client.channel('ecomax-orders-'+user.id)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders',filter:'user_id=eq.'+user.id},()=>loadOrders(user))
      .subscribe();
    window.addEventListener('beforeunload',()=>{clearInterval(refreshTimer);clearInterval(etaTimer);clearInterval(livePollTimer);liveMaps.forEach(x=>x.map.remove());liveMaps.clear();client.removeChannel(realtime);});

  }catch(e){
    loading.hidden=true;
    account.hidden=false;
    msg.textContent=e?.message||'ავტორიზაციის შემოწმება ვერ შესრულდა.';
  }
})();
</script>
</body></html>
