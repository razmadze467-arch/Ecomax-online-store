<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECOMAX — ჩემი ანგარიში</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;800;900&display=swap');:root{--bg:#02070b;--p:#071219;--line:#173b47;--c:#19e6ff;--m:#8ea6af;--g:#52e5ad;--r:#ff6477;--y:#ffd66b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(25,230,255,.1),transparent 32%),var(--bg);color:#fff;font-family:"Noto Sans Georgian",Arial}header{border-bottom:1px solid #12343f;background:rgba(2,8,12,.8);backdrop-filter:blur(15px);position:sticky;top:0;z-index:2}.nav{max-width:1200px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.logo{font:bold 24px Arial;letter-spacing:5px}.logo span{color:var(--c)}.btn{padding:10px 14px;border-radius:9px;border:1px solid #20434e;background:#07161c;color:#fff;cursor:pointer;font:700 13px inherit}.primary{background:var(--c);color:#001116;border-color:var(--c)}main{max-width:1200px;margin:auto;padding:35px 20px 70px}.hero{padding:28px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#08171e,#040b10);margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:30px}.muted{color:var(--m);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}.stat{padding:16px;border:1px solid #153640;border-radius:12px;background:#061017}.stat b{display:block;color:var(--c);font:800 23px Arial;margin-top:5px}.order{border:1px solid var(--line);border-radius:15px;background:#061017;margin:12px 0;overflow:hidden}.orderHead{padding:16px;display:flex;justify-content:space-between;gap:15px;align-items:center}.code{color:var(--c);font:800 14px monospace}.status{font-weight:800}.new{color:var(--c)}.confirmed{color:#7dd8ff}.processing{color:var(--y)}.shipped{color:#c0a6ff}.delivered{color:var(--g)}.cancelled{color:var(--r)}.items{padding:0 16px 16px}.item{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #123039;font-size:13px}.empty{text-align:center;padding:50px;color:var(--m)}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.orderHead{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div class="nav"><div class="logo"><span>✦</span> ECOMAX</div><div><button class="btn" onclick="location.href='index.html'">მთავარი</button> <button class="btn" onclick="logout()">გამოსვლა</button></div></div></header><main><div id="loading" class="hero">ანგარიშის ჩატვირთვა...</div><div id="app" style="display:none"><section class="hero"><h1>ჩემი ანგარიში</h1><div id="user" class="muted"></div><div class="stats"><div class="stat">შეკვეთები<b id="n">0</b></div><div class="stat">მუშავდება<b id="work">0</b></div><div class="stat">მიტანილი<b id="done">0</b></div><div class="stat">შეკვეთილი თანხა<b id="sum">0₾</b></div></div></section><h2>ჩემი შეკვეთები</h2><div id="orders"></div></div></main><script>
const db=supabase.createClient("https://mkxkqdvtmfbxmldnvsef.supabase.co","sb_publishable_K5orPxr9E0q9-K0dKYdt-g_0GTFvWtd");const L={new:"ახალი",confirmed:"დადასტურებული",processing:"მუშავდება",shipped:"გაგზავნილია",delivered:"მიტანილია",cancelled:"გაუქმებული"};const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const code=o=>"ECOMAX-"+o.id.slice(0,8).toUpperCase();
async function init(){const {data:{user}}=await db.auth.getUser();if(!user){location.href="login.html";return}const [p,o]=await Promise.all([db.from("profiles").select("full_name,phone").eq("id",user.id).maybeSingle(),db.from("orders").select("*").eq("user_id",user.id).order("created_at",{ascending:false})]);document.getElementById("loading").style.display="none";document.getElementById("app").style.display="block";document.getElementById("user").textContent=(p.data?.full_name||user.email)+" • "+(p.data?.phone||user.email);const orders=o.data||[];document.getElementById("n").textContent=orders.length;document.getElementById("work").textContent=orders.filter(x=>["new","confirmed","processing","shipped"].includes(x.status)).length;document.getElementById("done").textContent=orders.filter(x=>x.status==="delivered").length;document.getElementById("sum").textContent=orders.filter(x=>x.status!=="cancelled").reduce((a,x)=>a+Number(x.total||0),0).toFixed(2)+"₾";document.getElementById("orders").innerHTML=orders.length?orders.map(o=>{const items=Array.isArray(o.items)?o.items:[];return '<div class="order"><div class="orderHead"><div><div class="code">'+code(o)+'</div><div class="muted">'+new Date(o.created_at).toLocaleString("ka-GE")+'</div></div><div class="status '+(o.status||"new")+'">'+esc(L[o.status]||o.status)+'</div><div><b>'+Number(o.total||0).toFixed(2)+'₾</b></div></div><div class="items">'+items.map(x=>'<div class="item"><span>'+esc(x.product_name||x.name)+' × '+esc(x.quantity)+'</span><b>'+((Number(x.unit_price||x.price||0)*Number(x.quantity||1)).toFixed(2))+'₾</b></div>').join("")+'</div></div>'}).join(""):'<div class="empty">შეკვეთები ჯერ არ გაქვს.</div>'}
async function logout(){await db.auth.signOut();location.href="login.html"}init();
</script></body></html>
