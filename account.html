<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ECOMAX — ჩემი ანგარიში</title>
<style>
:root{--bg:#04080d;--card:#0a131d;--text:#eefaff;--muted:#8ea3ae;--cyan:#19e6ff;--blue:#48a9ff;--red:#ff647d;--green:#45e3a3}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--text);background:var(--bg)}body{min-height:100vh;padding:0}.bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 15%,#083746 0,transparent 34%),radial-gradient(circle at 85% 25%,#21134c 0,transparent 36%)}header{position:sticky;top:0;z-index:5;border-bottom:1px solid #ffffff12;background:#04080df0}.nav{height:70px;width:min(1100px,calc(100% - 28px));margin:auto;display:flex;align-items:center;gap:20px}.logo{font-weight:900;letter-spacing:5px;color:var(--cyan);font-size:23px}.links{margin-left:auto;display:flex;gap:18px}.links a{color:#aab8c0;text-decoration:none;font-size:12px}.links a:hover{color:var(--cyan)}main{position:relative;z-index:1;width:min(900px,calc(100% - 28px));margin:50px auto}.card{background:linear-gradient(145deg,#0e1b27,#060c12);border:1px solid #19e6ff25;border-radius:24px;padding:32px;box-shadow:0 25px 80px #0009}.eyebrow{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:2px}.card h1{font-size:clamp(34px,6vw,58px);margin:10px 0}.card p{color:var(--muted);line-height:1.7}.email{margin:25px 0;padding:18px;border:1px solid #ffffff12;border-radius:15px;background:#ffffff05}.email small{display:block;color:var(--muted);margin-bottom:6px}.email strong{font-size:16px;word-break:break-word}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:11px;text-decoration:none;font-weight:900;font-size:13px;border:1px solid #ffffff18;background:#ffffff06;color:var(--text);cursor:pointer}.primary{border:0;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#001015}.danger{color:#ff9aaa;border-color:#ff647d35}.msg{margin-top:16px;color:var(--green);font-size:12px}.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}@media(max-width:600px){.nav{height:62px}.links{gap:10px}.links a:nth-child(2){display:none}main{margin:25px auto}.card{padding:22px;border-radius:18px}.actions>*{width:100%}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20260918-1"></script>
</head>
<body><div class="bg"></div>
<header><nav class="nav"><div class="logo">ECOMAX</div><div class="links"><a href="index.html">მთავარი</a><a href="checkout.html">შეკვეთა</a><a href="index.html">პროდუქცია</a></div></nav></header>
<main><div id="loading" class="loading">ანგარიში იტვირთება...</div><section id="account" class="card" hidden><div class="eyebrow">ECOMAX ACCOUNT</div><h1>ჩემი ანგარიში.</h1><p>შენ შესული ხარ ECOMAX ანგარიშში.</p><div class="email"><small>ელფოსტა</small><strong id="email"></strong></div><div class="actions"><a class="btn primary" href="index.html">მთავარ გვერდზე</a><a class="btn" href="checkout.html">შეკვეთაზე გადასვლა</a><button id="logout" class="btn danger" type="button">გამოსვლა</button></div><div id="msg" class="msg"></div></section></main>
<script>
(async function(){'use strict';const client=window.ECOMAX_SUPABASE_CLIENT||window.ECOMAX_AUTH_CLIENT,loading=document.getElementById('loading'),account=document.getElementById('account'),email=document.getElementById('email'),msg=document.getElementById('msg');try{const r=await client.auth.getSession();const session=r?.data?.session;if(!session){location.replace('login.html');return}email.textContent=session.user?.email||'';loading.hidden=true;account.hidden=false;client.auth.onAuthStateChange(function(event,s){if(event==='SIGNED_OUT'||!s)location.replace('login.html')});document.getElementById('logout').addEventListener('click',async function(){this.disabled=true;const r=await client.auth.signOut();if(r.error){this.disabled=false;msg.textContent=r.error.message;return}location.replace('index.html')})}catch(e){loading.hidden=true;msg.textContent=e?.message||'ავტორიზაციის შემოწმება ვერ შესრულდა.';account.hidden=false}})();
</script>
</body></html>
