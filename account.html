<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECOMAX — შესვლა / რეგისტრაცია</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#02080d;color:#eefcff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#19e6ff22,transparent 45%);pointer-events:none}.box{width:min(480px,100%);background:#07151d;border:1px solid #19e6ff44;border-radius:25px;padding:30px;box-shadow:0 30px 100px #000;position:relative}.logo{text-align:center;font-size:30px;font-weight:900;letter-spacing:6px;color:#19e6ff}.sub{text-align:center;color:#829ba5;margin:8px 0 25px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#030b10;padding:5px;border-radius:12px;margin-bottom:22px}.tabs button{padding:12px;border:0;border-radius:9px;background:transparent;color:#8fa8b2;cursor:pointer;font-weight:800}.tabs button.active{background:#19e6ff;color:#001015}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#9ab0b8;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid #1b4653;background:#030b10;color:#fff;outline:0}.field input:focus{border-color:#19e6ff;box-shadow:0 0 18px #19e6ff15}.submit{width:100%;padding:14px;border:0;border-radius:11px;background:#19e6ff;color:#001015;font-weight:900;cursor:pointer;margin-top:8px}.msg{min-height:22px;text-align:center;margin:12px 0;font-size:13px}.success{color:#53e6b0}.error{color:#ff687a}.back{display:block;text-align:center;color:#8fa8b2;text-decoration:none;margin-top:18px;font-size:13px}.back:hover{color:#19e6ff}.hidden{display:none}.namegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:430px){.namegrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="box">
<div class="logo">ECOMAX</div><div class="sub">SECURE CUSTOMER PORTAL</div>
<div class="tabs"><button id="loginTab" class="active">შესვლა</button><button id="registerTab">რეგისტრაცია</button></div>

<form id="loginForm">
<div class="field"><label>ელფოსტა</label><input id="loginEmail" type="email" autocomplete="email" required></div>
<div class="field"><label>პაროლი</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
<button class="submit" type="submit">🔓 ანგარიშში შესვლა</button>
<div style="text-align:center;margin-top:12px"><button type="button" id="forgot" style="background:none;border:0;color:#19e6ff;cursor:pointer">დაგავიწყდა პაროლი?</button></div>
</form>

<form id="registerForm" class="hidden">
<div class="namegrid"><div class="field"><label>სახელი</label><input id="first" required></div><div class="field"><label>გვარი</label><input id="last" required></div></div>
<div class="field"><label>ელფოსტა</label><input id="regEmail" type="email" autocomplete="email" required></div>
<div class="field"><label>ტელეფონი</label><input id="phone" type="tel" autocomplete="tel"></div>
<div class="field"><label>პაროლი (მინ. 6 სიმბოლო)</label><input id="regPassword" type="password" autocomplete="new-password" minlength="6" required></div>
<div class="field"><label>გაიმეორე პაროლი</label><input id="confirm" type="password" autocomplete="new-password" required></div>
<button class="submit" type="submit">✦ ანგარიშის შექმნა</button>
</form>
<div id="msg" class="msg"></div>
<a class="back" href="/">← ECOMAX მთავარ გვერდზე</a>
</div>
<script>
const URL="https://mkxkqdvtmfbxmldnvsef.supabase.co",KEY="sb_publishable_K5orPxr9E0q9-K0dKYdt-g_0GTFvWtd";
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
const $=x=>document.getElementById(x), msg=(t,c="")=>{$("msg").textContent=t;$("msg").className="msg "+c};
function tab(reg){$("loginForm").classList.toggle("hidden",reg);$("registerForm").classList.toggle("hidden",!reg);$("loginTab").classList.toggle("active",!reg);$("registerTab").classList.toggle("active",reg);msg("")}
$("loginTab").onclick=()=>tab(false);$("registerTab").onclick=()=>tab(true);
sb.auth.getSession().then(({data})=>{if(data.session)location.href="/account.html"});
$("loginForm").onsubmit=async e=>{e.preventDefault();msg("⟳ მიმდინარეობს შესვლა...");try{const {data,error}=await sb.auth.signInWithPassword({email:$("loginEmail").value.trim().toLowerCase(),password:$("loginPassword").value});if(error)throw error;if(data.session){msg("✓ წარმატებით შეხვედი","success");setTimeout(()=>location.href="/account.html",400)}}catch(e){msg(e.message.toLowerCase().includes("not confirmed")?"ელფოსტა ჯერ არ არის დადასტურებული.":"ელფოსტა ან პაროლი არასწორია.","error")}};
$("registerForm").onsubmit=async e=>{e.preventDefault();const p=$("regPassword").value;if(p!==$("confirm").value){msg("პაროლები ერთმანეთს არ ემთხვევა.","error");return}if(p.length<6){msg("პაროლი მინიმუმ 6 სიმბოლო უნდა იყოს.","error");return}msg("⟳ ანგარიშის შექმნა...");try{const {data,error}=await sb.auth.signUp({email:$("regEmail").value.trim().toLowerCase(),password:p,options:{emailRedirectTo:location.origin+"/account.html",data:{first_name:$("first").value.trim(),last_name:$("last").value.trim(),phone:$("phone").value.trim()}}});if(error)throw error;if(data.session){msg("✓ ანგარიში შეიქმნა","success");setTimeout(()=>location.href="/account.html",400)}else msg("✓ რეგისტრაცია დასრულდა. შეამოწმე ელფოსტა დასადასტურებლად.","success")}catch(e){msg(e.message.toLowerCase().includes("already registered")?"ეს ელფოსტა უკვე რეგისტრირებულია.":"რეგისტრაცია ვერ მოხერხდა.","error")}};
$("forgot").onclick=async()=>{const email=prompt("შეიყვანე შენი ელფოსტა:");if(!email)return;try{const {error}=await sb.auth.resetPasswordForEmail(email.trim().toLowerCase(),{redirectTo:location.origin+"/account.html"});if(error)throw error;msg("✓ პაროლის აღდგენის ბმული გაიგზავნა.","success")}catch(e){msg("პაროლის აღდგენა ვერ მოხერხდა.","error")}};
</script>
</body></html>
