<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ECOMAX — ჩემი ანგარიში</title>
<style>
:root{--bg:#04080d;--card:#0a131d;--text:#eefaff;--muted:#8ea3ae;--cyan:#19e6ff;--blue:#48a9ff;--red:#ff647d;--green:#45e3a3}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--text);background:var(--bg)}body{min-height:100vh;padding:0}.bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 15%,#083746 0,transparent 34%),radial-gradient(circle at 85% 25%,#21134c 0,transparent 36%)}header{position:sticky;top:0;z-index:5;border-bottom:1px solid #ffffff12;background:#04080df0}.nav{height:70px;width:min(1100px,calc(100% - 28px));margin:auto;display:flex;align-items:center;gap:20px}.logo{font-weight:900;letter-spacing:5px;color:var(--cyan);font-size:23px}.links{margin-left:auto;display:flex;gap:18px}.links a{color:#aab8c0;text-decoration:none;font-size:12px}.links a:hover{color:var(--cyan)}main{position:relative;z-index:1;width:min(900px,calc(100% - 28px));margin:50px auto}.card{background:linear-gradient(145deg,#0e1b27,#060c12);border:1px solid #19e6ff25;border-radius:24px;padding:32px;box-shadow:0 25px 80px #0009}.eyebrow{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:2px}.card h1{font-size:clamp(34px,6vw,58px);margin:10px 0}.card p{color:var(--muted);line-height:1.7}.email{margin:25px 0;padding:18px;border:1px solid #ffffff12;border-radius:15px;background:#ffffff05}.email small{display:block;color:var(--muted);margin-bottom:6px}.email strong{font-size:16px;word-break:break-word}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:11px;text-decoration:none;font-weight:900;font-size:13px;border:1px solid #ffffff18;background:#ffffff06;color:var(--text);cursor:pointer}.primary{border:0;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#001015}.danger{color:#ff9aaa;border-color:#ff647d35}.msg{margin-top:16px;color:var(--green);font-size:12px}.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}@media(max-width:600px){.nav{height:62px}.links{gap:10px}.links a:nth-child(2){display:none}main{margin:25px auto}.card{padding:22px;border-radius:18px}.actions>*{width:100%}}
.orders-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:35px;padding-top:25px;border-top:1px solid #ffffff12}.orders-head h2{margin:5px 0 0;font-size:22px}.orders{display:grid;gap:14px;margin-top:18px}.order-card{border:1px solid rgba(25,230,255,.15);border-radius:18px;padding:18px;background:linear-gradient(145deg,#0b1823,#050b11);box-shadow:inset 0 0 20px rgba(25,230,255,.025)}.order-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.order-number{font-weight:900;color:#efffff;letter-spacing:.5px}.status{padding:7px 11px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid #ffffff18}.status.new{color:#19e6ff;border-color:#19e6ff45}.status.processing{color:#ffd76a;border-color:#ffd76a45}.status.shipped{color:#b47cff;border-color:#b47cff45}.status.completed{color:#45e3a3;border-color:#45e3a345}.status.cancelled{color:#ff647d;border-color:#ff647d45}.order-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:11px}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:17px}.step{position:relative;text-align:center;color:#607784;font-size:9px}.step:before{content:"";display:block;height:4px;border-radius:5px;background:#ffffff12;margin-bottom:7px}.step.done{color:#19e6ff}.step.done:before{background:linear-gradient(90deg,#19e6ff,#48a9ff);box-shadow:0 0 10px rgba(25,230,255,.35)}.items-mini{margin-top:14px;padding-top:12px;border-top:1px solid #ffffff0d;color:#aabcc4;font-size:11px;line-height:1.8}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #19e6ff25;border-radius:15px}@media(max-width:600px){.orders-head{align-items:flex-start}.timeline{grid-template-columns:1fr 1fr}.order-card{padding:14px}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20260918-1"></script>
<style id="ecomax-global-neon-boost">
/* Lightweight global blue/cyan neon polish — visual only */
@keyframes ecomaxNeonBreath{0%,100%{text-shadow:0 0 4px rgba(0,234,255,.25),0 0 12px rgba(0,140,255,.12)}50%{text-shadow:0 0 8px rgba(0,234,255,.55),0 0 20px rgba(0,140,255,.22)}}
@keyframes ecomaxLineFlow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
body{background-image:radial-gradient(circle at 15% 10%,rgba(0,234,255,.09),transparent 28%),radial-gradient(circle at 88% 22%,rgba(50,140,255,.09),transparent 30%),linear-gradient(rgba(0,234,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(50,140,255,.022) 1px,transparent 1px);background-size:auto,auto,44px 44px,44px 44px}
h1,h2,h3,h4,.logo,.brand,.section-title,.product-name,.product-title,.price,.hero-badge,.tag,.eyebrow{animation:ecomaxNeonBreath 3.2s ease-in-out infinite}
button,.primary-button,.secondary-button,.cart-button,.back,.login-link,.register-link,.iconbtn,.primary,.ghost{
 transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease!important;
}
button:hover,.primary-button:hover,.secondary-button:hover,.cart-button:hover,.back:hover,.login-link:hover,.register-link:hover,.iconbtn:hover,.primary:hover,.ghost:hover{
 box-shadow:0 0 12px rgba(0,234,255,.28),0 0 28px rgba(50,140,255,.13)!important;
 border-color:rgba(0,234,255,.7)!important;
}
a:hover{ text-shadow:0 0 8px rgba(0,234,255,.35)}
@media(prefers-reduced-motion:reduce){h1,h2,h3,h4,.logo,.brand,.section-title,.product-name,.product-title,.price,.hero-badge,.tag,.eyebrow{animation:none!important}}
</style><style id="ECOMAX-ACCOUNT-FIX-HUD">
.loading[hidden]{display:none!important}
.loading{min-height:0!important}
main{min-height:calc(100vh - 70px)!important}
.card{
 position:relative;overflow:hidden;
 border-color:rgba(25,230,255,.28)!important;
 box-shadow:0 20px 70px rgba(0,0,0,.45),0 0 35px rgba(25,230,255,.07),inset 0 0 30px rgba(25,230,255,.025)!important;
}
.card::after{
 content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
 background:linear-gradient(120deg,transparent 7%,#19e6ff 25%,#48a9ff 43%,#8b5cff 60%,#ff25d9 78%,transparent 93%);
 background-size:220% 100%;animation:accountLine 5s linear infinite;opacity:.7;
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude;
}
.card>*{position:relative;z-index:2}
.email{border-color:rgba(25,230,255,.18)!important;box-shadow:inset 0 0 18px rgba(25,230,255,.03)}
.btn{box-shadow:0 0 12px rgba(25,230,255,.07)!important}
.btn.primary{box-shadow:0 0 20px rgba(25,230,255,.2)!important}
@keyframes accountLine{0%{background-position:220% 0}100%{background-position:-20% 0}}
@media(prefers-reduced-motion:reduce){.card::after{animation:none!important}}
</style>
<style id="ECOMAX-UNIFIED-HUD-V3">
:root{--e-cyan:#00f6ff;--e-blue:#168dff;--e-violet:#7b4dff;--e-pink:#ff25d9;--e-white:#efffff}
body{background-color:#020812!important}
body:after{content:"";position:fixed;left:0;right:0;top:0;height:2px;z-index:9998;pointer-events:none;background:linear-gradient(90deg,transparent,#00f6ff 18%,#7b4dff 48%,#ff25d9 72%,transparent);background-size:220% 100%;box-shadow:0 0 12px #00f6ff,0 0 28px rgba(123,77,255,.45);animation:ecomaxTopScan 6s linear infinite;opacity:.8}
a,button,input,select,textarea{font-family:inherit}
button,.btn,.submit,.back{position:relative;overflow:hidden}
button:before,.btn:before,.submit:before,.back:before{content:"";position:absolute;top:0;bottom:0;width:28%;left:-40%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),rgba(0,246,255,.28),transparent);transform:skewX(-18deg);animation:ecomaxButtonScan 4.8s ease-in-out infinite}
.card,.box,.info-card,.product-card{
 box-shadow:0 0 0 1px rgba(0,246,255,.035),0 18px 65px rgba(0,0,0,.42),0 0 28px rgba(0,246,255,.07),inset 0 0 28px rgba(0,246,255,.025)!important
}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 2px rgba(0,246,255,.08),0 0 18px rgba(0,246,255,.22),inset 0 0 18px rgba(0,246,255,.04)!important}
@keyframes ecomaxTopScan{0%{background-position:220% 0}100%{background-position:-20% 0}}
@keyframes ecomaxButtonScan{0%,62%{left:-40%;opacity:0}70%{opacity:1}90%,100%{left:125%;opacity:0}}
@media(prefers-reduced-motion:reduce){body:after,button:before,.btn:before,.submit:before,.back:before{animation:none!important}}
</style>
</head>
<body><div class="bg"></div>
<header><nav class="nav"><div class="logo">ECOMAX</div><div class="links"><a href="index.html">მთავარი</a><a href="checkout.html">შეკვეთა</a><a href="index.html">პროდუქცია</a></div></nav></header>
<main>
  <div id="loading" class="loading">ანგარიში იტვირთება...</div>

  <section id="account" class="card" hidden>
    <div class="eyebrow">ECOMAX ACCOUNT</div>
    <h1>ჩემი ანგარიში.</h1>
    <p>შენ შესული ხარ ECOMAX ანგარიშში.</p>

    <div class="email">
      <small>ელფოსტა</small>
      <strong id="email"></strong>
    </div>

    <div class="actions">
      <a class="btn primary" href="index.html">მთავარ გვერდზე</a>
      <a class="btn" href="checkout.html">ახალი შეკვეთა</a>
      <button id="logout" class="btn danger" type="button">გამოსვლა</button>
    </div>

    <div id="msg" class="msg"></div>

    <div class="orders-head">
      <div>
        <div class="eyebrow">ORDER CENTER</div>
        <h2>📦 ჩემი შეკვეთები</h2>
      </div>
      <button id="refreshOrders" class="btn" type="button">↻ განახლება</button>
    </div>

    <div id="orders" class="orders">
      <div class="empty">შეკვეთები იტვირთება...</div>
    </div>
  </section>
</main>
<script>
(async function(){
  'use strict';

  const client=window.ECOMAX_SUPABASE_CLIENT||window.ECOMAX_AUTH_CLIENT;
  const loading=document.getElementById('loading');
  const account=document.getElementById('account');
  const email=document.getElementById('email');
  const msg=document.getElementById('msg');
  const ordersEl=document.getElementById('orders');

  const labels={new:'ახალი',processing:'მუშავდება',shipped:'იგზავნება',completed:'ჩაბარდა',cancelled:'გაუქმებული'};
  const steps=['new','processing','shipped','completed'];

  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));}
  function money(v){return Number(v||0).toLocaleString('ka-GE',{minimumFractionDigits:0,maximumFractionDigits:2})+' ₾';}
  function date(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('ka-GE');}

  function timeline(status){
    if(status==='cancelled') return '<div class="timeline"><div class="step done">გაუქმებული</div></div>';
    const current=Math.max(0,steps.indexOf(status));
    return '<div class="timeline">'+steps.map((s,i)=>'<div class="step '+(i<=current?'done':'')+'">'+labels[s]+'</div>').join('')+'</div>';
  }

  function renderOrders(list){
    if(!list.length){ordersEl.innerHTML='<div class="empty">შეკვეთები ჯერ არ გაქვს.</div>';return;}
    ordersEl.innerHTML=list.map(o=>{
      const items=Array.isArray(o.items)?o.items.map(i=>esc(i.name||i.product_name||'პროდუქტი')+' × '+esc(i.quantity||1)).join(' • '):'';
      const number=o.order_number||('ECX-'+String(o.id||'').slice(0,8).toUpperCase());
      return '<article class="order-card">'+
        '<div class="order-top"><div class="order-number">📦 '+esc(number)+'</div><span class="status '+esc(o.status||'new')+'">'+esc(labels[o.status]||o.status||'ახალი')+'</span></div>'+
        '<div class="order-meta"><span>'+esc(date(o.created_at))+'</span><b>'+money(o.total)+'</b></div>'+
        timeline(o.status||'new')+
        (items?'<div class="items-mini">'+items+'</div>':'')+
      '</article>';
    }).join('');
  }

  async function loadOrders(user){
    ordersEl.innerHTML='<div class="empty">შეკვეთები იტვირთება...</div>';
    const {data,error}=await client.from('orders').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    if(error){console.error('Customer orders:',error);ordersEl.innerHTML='<div class="empty">შეკვეთების ჩატვირთვა ვერ მოხერხდა.<br><small>'+esc(error.message)+'</small></div>';return;}
    renderOrders(data||[]);
  }

  try{
    if(window.ECOMAX_AUTH_READY) await window.ECOMAX_AUTH_READY;
    if(!client) throw new Error('Supabase კლიენტი ვერ ჩაიტვირთა.');

    const r=await client.auth.getSession();
    const session=r?.data?.session;
    if(!session){location.replace('login.html');return;}

    const user=session.user;
    email.textContent=user.email||'';
    loading.hidden=true;
    account.hidden=false;

    await loadOrders(user);

    document.getElementById('refreshOrders').addEventListener('click',()=>loadOrders(user));

    client.auth.onAuthStateChange((event,s)=>{
      if(event==='SIGNED_OUT'||!s) location.replace('login.html');
    });

    document.getElementById('logout').addEventListener('click',async function(){
      this.disabled=true;
      const r=await client.auth.signOut();
      if(r.error){this.disabled=false;msg.textContent=r.error.message;return;}
      location.replace('index.html');
    });

    // სტატუსის ცვლილება ავტომატურად გამოჩნდება დაახლოებით ყოველ 15 წამში.
    setInterval(()=>loadOrders(user),15000);

  }catch(e){
    loading.hidden=true;
    account.hidden=false;
    msg.textContent=e?.message||'ავტორიზაციის შემოწმება ვერ შესრულდა.';
  }
})();
</script>
</body></html>
