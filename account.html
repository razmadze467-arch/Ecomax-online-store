<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#02070b"><title>ECOMAX — ჩემი ანგარიში</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#073944,#02070b 45%);color:#effcff;font-family:system-ui,-apple-system,"Noto Sans Georgian",sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.top{padding:20px 0;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;letter-spacing:4px;color:#19e6ff;text-shadow:0 0 20px #19e6ff55}.back,.btn,.tab,.side button{border:1px solid #19e6ff35;border-radius:11px;background:#071820;color:#effcff;padding:11px 14px;cursor:pointer}.back{text-decoration:none}.hero{text-align:center;padding:30px 0}.hero h1{font-size:clamp(32px,7vw,56px);margin:0}.muted{color:#8ba5ae}.card{background:#07141bee;border:1px solid #19e6ff35;border-radius:22px;padding:22px;box-shadow:0 0 45px #00eaff12;backdrop-filter:blur(14px)}.auth{width:min(480px,100%);margin:auto}.tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:20px}.tab{border-radius:0}.tab:first-child{border-radius:10px 0 0 10px}.tab:last-child{border-radius:0 10px 10px 0}.tab.active,.side button.active{background:#0c3b45}.hide{display:none!important}label{display:block;margin:12px 0 6px;color:#b4cbd1;font-size:13px}input{width:100%;padding:13px;border-radius:11px;border:1px solid #19e6ff30;background:#020b10;color:#fff;outline:0}input:focus{border-color:#19e6ff;box-shadow:0 0 15px #19e6ff18}.btn{width:100%;margin-top:15px;background:#0a3038;font-weight:800}.link{display:block;border:0;background:none;color:#19e6ff;margin:13px auto;cursor:pointer}.msg{min-height:20px;margin-top:12px;font-size:13px}.error{color:#ff7085}.ok{color:#61edaa}.dashboard{display:grid;grid-template-columns:270px 1fr;gap:18px}.side{display:flex;flex-direction:column;gap:7px}.avatar{width:76px;height:76px;border:1px solid #19e6ff66;border-radius:50%;display:grid;place-items:center;font-size:30px;margin:0 auto 10px;box-shadow:0 0 25px #19e6ff20}.side button{text-align:left;background:transparent}.order{padding:14px;border:1px solid #19e6ff1c;border-radius:12px;margin:9px 0}.badge{float:right;padding:4px 8px;border:1px solid #19e6ff44;border-radius:99px;font-size:11px}.danger{color:#ff7085}@media(max-width:700px){.dashboard{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.identity{grid-column:1/-1}}
</style></head><body><div class="wrap"><header class="top"><div class="logo">ECOMAX</div><a class="back" href="/">← მაღაზიაში</a></header>
<section id="auth"><div class="hero"><h1>MY ACCOUNT</h1><p class="muted">უსაფრთხო ავტორიზაცია და შენი შეკვეთები</p></div><div class="card auth"><div class="tabs"><button id="lt" class="tab active" onclick="mode('login')">ავტორიზაცია</button><button id="st" class="tab" onclick="mode('signup')">რეგისტრაცია</button></div>
<form id="lf" onsubmit="login(event)"><label>ელფოსტა</label><input id="le" type="email" autocomplete="email" required><label>პაროლი</label><input id="lp" type="password" autocomplete="current-password" required><button class="btn">შესვლა</button><button type="button" class="link" onclick="forgot()">დაგავიწყდა პაროლი?</button></form>
<form id="sf" class="hide" onsubmit="signup(event)"><label>სახელი და გვარი</label><input id="sn" autocomplete="name" required><label>ტელეფონი</label><input id="sp" type="tel" autocomplete="tel"><label>ელფოსტა</label><input id="se" type="email" autocomplete="email" required><label>პაროლი <span class="muted">(მინ. 8 სიმბოლო)</span></label><input id="ss" type="password" minlength="8" autocomplete="new-password" required><button class="btn">ანგარიშის შექმნა</button></form><div id="am" class="msg"></div></div></section>
<section id="account" class="hide"><div class="hero"><h1>ACCOUNT</h1><p id="welcome" class="muted"></p></div><div class="dashboard"><aside class="card side"><div class="identity" style="text-align:center"><div class="avatar">🤖</div><b id="name">ECOMAX USER</b><small id="email" class="muted" style="display:block"></small></div><button class="active" onclick="tab('profile',this)">👤 პროფილი</button><button onclick="tab('orders',this)">📦 შეკვეთები</button><button onclick="tab('security',this)">🔐 უსაფრთხოება</button><button onclick="logout()">↪ გასვლა</button></aside><main class="card">
<div id="profile"><h2>პროფილი</h2><label>სახელი და გვარი</label><input id="pn"><label>ტელეფონი</label><input id="pp"><button class="btn" onclick="saveProfile()">შენახვა</button><div id="pm" class="msg"></div></div>
<div id="orders" class="hide"><h2>ჩემი შეკვეთები</h2><div id="ol" class="muted">იტვირთება...</div></div>
<div id="security" class="hide"><h2>უსაფრთხოება</h2><label>ახალი პაროლი</label><input id="np" type="password" minlength="8" autocomplete="new-password"><button class="btn" onclick="changePassword()">პაროლის შეცვლა</button><div id="sm" class="msg"></div></div>
</main></div></section></div>
<script>
const URL="https://mkxkqdvtmfbxmldnvsef.supabase.co",KEY="sb_publishable_K5orPxr9E0q9-K0dKYdt-g_0GTFvWtd",sb=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
function message(id,t,c=""){const e=$(id);e.textContent=t;e.className="msg "+c}
function mode(x){$("lf").classList.toggle("hide",x!=="login");$("sf").classList.toggle("hide",x!=="signup");$("lt").classList.toggle("active",x==="login");$("st").classList.toggle("active",x==="signup");message("am","")}
async function login(e){e.preventDefault();message("am","მიმდინარეობს შესვლა...");const r=await sb.auth.signInWithPassword({email:$("le").value.trim(),password:$("lp").value});if(r.error)return message("am",r.error.message,"error");load()}
async function signup(e){e.preventDefault();message("am","ანგარიში იქმნება...");const r=await sb.auth.signUp({email:$("se").value.trim(),password:$("ss").value,options:{data:{full_name:$("sn").value.trim(),phone:$("sp").value.trim()}}});if(r.error)return message("am",r.error.message,"error");if(r.data.session)load();else message("am","ანგარიში შეიქმნა. შეამოწმე ელფოსტა დასადასტურებლად.","ok")}
async function forgot(){const e=prompt("შეიყვანე ანგარიშის ელფოსტა:");if(!e)return;const r=await sb.auth.resetPasswordForEmail(e.trim(),{redirectTo:location.origin+"/account.html"});alert(r.error?r.error.message:"აღდგენის ბმული გამოგზავნილია ელფოსტაზე.")}
async function load(){const r=await sb.auth.getUser(),u=r.data.user;if(!u)return;$("auth").classList.add("hide");$("account").classList.remove("hide");const m=u.user_metadata||{};$("name").textContent=m.full_name||"ECOMAX USER";$("email").textContent=u.email||"";$("welcome").textContent="მოგესალმები, "+(m.full_name||"მომხმარებელო")+" 👋";$("pn").value=m.full_name||"";$("pp").value=m.phone||"";orders(u.id)}
async function saveProfile(){const r=await sb.auth.updateUser({data:{full_name:$("pn").value.trim(),phone:$("pp").value.trim()}});message("pm",r.error?r.error.message:"პროფილი განახლდა.",r.error?"error":"ok");if(!r.error)load()}
async function changePassword(){const p=$("np").value;if(p.length<8)return message("sm","პაროლი მინიმუმ 8 სიმბოლო უნდა იყოს.","error");const r=await sb.auth.updateUser({password:p});message("sm",r.error?r.error.message:"პაროლი შეიცვალა.",r.error?"error":"ok");if(!r.error)$("np").value=""}
async function orders(uid){const b=$("ol"),r=await sb.from("orders").select("order_number,status,total,created_at,updated_at").eq("user_id",uid).order("created_at",{ascending:false}).limit(30);if(r.error)return b.innerHTML='<span class="danger">შეკვეთების ჩატვირთვა ვერ მოხერხდა.</span>';if(!r.data?.length)return b.textContent="ჯერ შეკვეთები არ გაქვს.";b.innerHTML=r.data.map(o=>'<div class="order"><b>'+esc(o.order_number||"შეკვეთა")+'</b><span class="badge">'+esc(status(o.status))+'</span><div style="margin-top:10px">სულ: <b>'+Number(o.total||0).toFixed(2)+'₾</b></div><small class="muted">'+new Date(o.created_at).toLocaleString("ka-GE")+'</small></div>').join("")}
function status(s){return({new:"მიღებულია",processing:"მუშავდება",shipped:"იგზავნება",completed:"ჩაბარდა",cancelled:"გაუქმებული"})[s]||s||"უცნობი"}
function esc(v){return String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function tab(x,b){["profile","orders","security"].forEach(n=>$(n).classList.toggle("hide",n!==x));document.querySelectorAll(".side button").forEach(e=>e.classList.remove("active"));b.classList.add("active");if(x==="orders")sb.auth.getUser().then(r=>orders(r.data.user.id))}
async function logout(){await sb.auth.signOut();location.reload()}sb.auth.onAuthStateChange((e,s)=>{if(s)load()});load();
</script></body></html>
