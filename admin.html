<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECOMAX — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#02070b;color:#fff;font-family:"Noto Sans Georgian",Arial}.wrap{max-width:1250px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.brand{font:bold 25px Arial;letter-spacing:5px}.brand span{color:#19e6ff}.btn{background:#19e6ff;color:#001116;border:0;padding:11px 15px;border-radius:9px;font-weight:800;cursor:pointer}.danger{background:#2b0c12;color:#ffadb7;border:1px solid #7e303b}.panel{background:#071219;border:1px solid #173b47;border-radius:17px;padding:22px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#061017;border:1px solid #143541;border-radius:13px;padding:18px}.stat b{display:block;font-size:25px;color:#19e6ff;margin-top:5px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px 8px;border-bottom:1px solid #14313a;text-align:left}.table th{color:#91aab4}.select{background:#061017;color:#fff;border:1px solid #20424d;border-radius:7px;padding:7px}.msg{padding:15px;color:#ffadb7}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.product{padding:15px;border:1px solid #173844;border-radius:12px;background:#061017}.product b{display:block;margin-bottom:7px}@media(max-width:800px){.stats,.products{grid-template-columns:1fr 1fr}.table{display:block;overflow:auto}}@media(max-width:520px){.wrap{padding:15px}.stats,.products{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><span>✦</span> ECOMAX ADMIN</div><button class="btn danger" onclick="logout()">გამოსვლა</button></div><div id="gate" class="panel">შემოწმება...</div><div id="app" style="display:none"><div class="stats"><div class="stat">შეკვეთები<b id="ordersN">0</b></div><div class="stat">შემოსავალი<b id="revenue">0₾</b></div><div class="stat">პროდუქტები<b id="productsN">0</b></div><div class="stat">მომხმარებლები<b id="usersN">—</b></div></div><div class="panel"><h2>📦 შეკვეთები</h2><div id="orders"></div></div><div class="panel"><h2>🛍️ პროდუქტები</h2><div id="products" class="products"></div></div></div></div><script>
const db=supabase.createClient("https://mkxkqdvtmfbxmldnvsef.supabase.co","sb_publishable_K5orPxr9E0q9-K0dKYdt-g_0GTFvWtd");const statusLabels={new:"ახალი",confirmed:"დადასტურებული",processing:"მუშავდება",shipped:"გაგზავნილია",delivered:"მიტანილია",cancelled:"გაუქმებული"};const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function init(){const {data:{user}}=await db.auth.getUser();if(!user){location.href="login.html";return}const {data:p}=await db.from("profiles").select("role").eq("id",user.id).maybeSingle();if(p?.role!=="admin"){document.getElementById("gate").innerHTML="⛔ ამ გვერდზე წვდომა მხოლოდ ადმინისტრატორს აქვს.";return}document.getElementById("gate").style.display="none";document.getElementById("app").style.display="block";load()}
async function load(){const [o,p]=await Promise.all([db.from("orders").select("*").order("created_at",{ascending:false}),db.from("products").select("*").order("id")]);const orders=o.data||[],products=p.data||[];document.getElementById("ordersN").textContent=orders.length;document.getElementById("revenue").textContent=orders.filter(x=>x.status!=="cancelled").reduce((a,x)=>a+Number(x.total||0),0).toFixed(2)+"₾";document.getElementById("productsN").textContent=products.length;document.getElementById("orders").innerHTML=orders.length?'<table class="table"><thead><tr><th>კოდი</th><th>კლიენტი</th><th>ტელეფონი</th><th>თანხა</th><th>სტატუსი</th><th>თარიღი</th></tr></thead><tbody>'+orders.map(x=>'<tr><td>ECOMAX-'+x.id.slice(0,8).toUpperCase()+'</td><td>'+esc(x.customer_name)+'</td><td>'+esc(x.phone)+'</td><td>'+Number(x.total||0).toFixed(2)+'₾</td><td><select class="select" onchange="setStatus(\''+x.id+'\',this.value)">'+Object.entries(statusLabels).map(([k,v])=>'<option value="'+k+'" '+(x.status===k?"selected":"")+'>'+v+'</option>').join("")+'</select></td><td>'+new Date(x.created_at).toLocaleString("ka-GE")+'</td></tr>').join("")+'</tbody></table>':'<p style="color:#91aab4">შეკვეთები ჯერ არ არის.</p>';document.getElementById("products").innerHTML=products.map(x=>'<div class="product"><b>'+esc(x.name)+'</b><span style="color:#19e6ff">'+Number(x.price).toFixed(2)+'₾ / '+esc(x.unit)+'</span><p style="color:#8fa6af;font-size:12px">'+esc(x.description)+'</p></div>').join("")}
async function setStatus(id,status){const {error}=await db.from("orders").update({status}).eq("id",id);if(error)alert(error.message);else load()}
async function logout(){await db.auth.signOut();location.href="login.html"}init();
</script></body></html>
