<script id="ecomax-line-5d-tilt">
(function(){
 const card=document.querySelector('.card');
 if(!card || window.matchMedia('(pointer:coarse)').matches) return;
 let raf=0;
 function move(e){
   const r=card.getBoundingClientRect();
   const x=(e.clientX-r.left)/r.width-.5;
   const y=(e.clientY-r.top)/r.height-.5;
   cancelAnimationFrame(raf);
   raf=requestAnimationFrame(()=>card.style.transform='rotateX('+(-y*5)+'deg) rotateY('+(x*6)+'deg) translateZ(0)');
 }
 function reset(){card.style.transform='rotateX(0deg) rotateY(0deg)'}
 card.addEventListener('pointermove',move);
 card.addEventListener('pointerleave',reset);
})();

<script>
(async function(){
const db=window.ECOMAX_SUPABASE_CLIENT;
const form=document.getElementById('form'),btn=document.getElementById('submit'),err=document.getElementById('error'),ok=document.getElementById('ok');
function showErr(t){err.textContent=t;err.style.display='block';ok.style.display='none'}
function showOk(t){ok.textContent=t;ok.style.display='block';err.style.display='none'}
if(!db){showErr('Supabase ვერ ჩაიტვირთა. გვერდი განაახლე.');return}
const {data:{session}}=await db.auth.getSession();
if(session){location.replace('line.html');return}
form.addEventListener('submit',async e=>{
 e.preventDefault();err.style.display='none';ok.style.display='none';
 const name=document.getElementById('name').value.trim();
 const phone=document.getElementById('phone').value.trim();
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const password2=document.getElementById('password2').value;
 if(password!==password2){showErr('პაროლები ერთმანეთს არ ემთხვევა.');return}
 if(password.length<8){showErr('პაროლი უნდა შეიცავდეს მინიმუმ 8 სიმბოლოს.');return}
 btn.disabled=true;btn.textContent='ანგარიში იქმნება...';
 const {data,error}=await db.auth.signUp({
   email,
   password,
   options:{
     emailRedirectTo:'https://ecomax.com.ge/line.html',
     data:{
       full_name:name,
       phone:phone,
       courier_application:true
     }
   }
 });
 if(error){showErr('რეგისტრაცია ვერ შესრულდა: '+error.message);btn.disabled=false;btn.textContent='კურიერის ანგარიშის შექმნა';return}
 if(data.session){
   await db.auth.signOut();
   showOk('რეგისტრაცია დასრულებულია. თქვენი კურიერის ანგარიში ჯერ ადმინისტრატორმა უნდა დაადასტუროს. შემდეგ შეძლებთ ECOMAX LINE-ში შესვლას.');
 }else{
   showOk('რეგისტრაცია მიღებულია. შეამოწმე ელფოსტა და დაადასტურე ანგარიში. შემდეგ დაელოდე ადმინისტრატორის ავტორიზაციას.');
 }
 form.reset();btn.disabled=false;btn.textContent='კურიერის ანგარიშის შექმნა';
});
})();
</script>
</body>
</html>
