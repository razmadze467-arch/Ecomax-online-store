<title>ECOMAX LINE — Courier Registration</title>
<style>:root{--bg:#01040a;--panel:#07121d;--cyan:#19eaff;--pink:#ff3fd2;--violet:#8d63ff;--text:#f2fdff;--muted:#86a1ad}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--text);background:#01040a}
body{min-height:100vh;display:grid;place-items:center;padding:20px;overflow:hidden;background:radial-gradient(circle at 18% 12%,#063f51 0,transparent 30%),radial-gradient(circle at 82% 78%,#321052 0,transparent 34%),linear-gradient(135deg,#01040a,#030913)}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(#19eaff08 1px,transparent 1px),linear-gradient(90deg,#19eaff08 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,transparent,#fff 18%,#fff 82%,transparent);pointer-events:none}
body:after{content:"";position:fixed;width:520px;height:520px;border:1px solid #19eaff22;border-radius:50%;box-shadow:0 0 80px #19eaff10,inset 0 0 80px #ff3fd20a;animation:spin 18s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{box-shadow:0 0 45px #19eaff35,inset 0 0 30px #19eaff15}}
.card{position:relative;z-index:2;width:min(540px,100%);padding:30px;border:1px solid #19eaff3d;border-radius:30px;background:linear-gradient(145deg,#091a27f5,#030a12f7);box-shadow:0 35px 120px #000d,0 0 70px #19eaff0b;backdrop-filter:blur(22px);overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--pink),transparent);box-shadow:0 0 20px var(--cyan)}
.card:after{content:"LINE // SECURE GATEWAY";position:absolute;right:18px;top:14px;color:#ffffff35;font-size:7px;letter-spacing:2px}
.logo{text-align:center;color:var(--cyan);font-weight:1000;letter-spacing:7px;font-size:28px;text-shadow:0 0 25px #19eaff80}.line{text-align:center;color:#78939f;font-size:9px;letter-spacing:4px;margin-top:7px}
.icon{width:82px;height:82px;margin:24px auto 18px;border-radius:26px;display:grid;place-items:center;border:1px solid #19eaff55;background:radial-gradient(circle,#0b2a35,#050d15);box-shadow:0 0 40px #19eaff1d,inset 0 0 30px #19eaff0d;animation:pulse 3s ease-in-out infinite;font-size:35px}
h1{text-align:center;font-size:27px;margin:0 0 8px}.desc{text-align:center;color:var(--muted);font-size:12px;line-height:1.7;margin:0 0 25px}
label{display:block;color:#a7bdc6;font-size:10px;margin:15px 0 7px;font-weight:900;letter-spacing:.8px}input{width:100%;height:52px;border-radius:13px;border:1px solid #ffffff16;background:#020910;color:#fff;padding:0 15px;outline:none;font-size:14px;transition:.2s}input:focus{border-color:#19eaff90;box-shadow:0 0 25px #19eaff18}
button{width:100%;height:52px;margin-top:20px;border:1px solid #19eaff55;border-radius:13px;background:linear-gradient(100deg,var(--cyan),#5bb5ff 55%,var(--pink));color:#001016;font-weight:1000;cursor:pointer;box-shadow:0 12px 35px #19eaff20;transition:.2s}button:hover{transform:translateY(-1px);box-shadow:0 15px 45px #19eaff30}button:disabled{opacity:.55;cursor:wait}
.error{display:none;margin-top:14px;padding:12px;border-radius:11px;border:1px solid #ff4f813d;background:#220a14;color:#ffafbf;font-size:11px;line-height:1.55}.back{display:block;text-align:center;margin-top:18px;color:#829aa5;text-decoration:none;font-size:11px}.back:hover{color:var(--cyan)}.hint{text-align:center;color:#4e6873;font-size:8px;margin-top:20px;letter-spacing:1.5px}
@media(max-width:520px){body{padding:12px}.card{padding:27px 20px;border-radius:24px}.card:after{display:none}}</style>

</style><style id="ecomax-line-5d-form">
/* ECOMAX LINE // 3D • 4D • 5D HOLO FORM */
body{perspective:1200px}
.card{
  transform-style:preserve-3d;
  will-change:transform;
  border-color:#19eaff66!important;
  box-shadow:0 35px 100px #000e,0 0 45px #19eaff18,0 0 120px #8d63ff10,inset 0 1px #ffffff18!important;
  transition:transform .18s ease-out,box-shadow .3s ease;
}
.card:before{height:3px!important;animation:holoLine 3s linear infinite;background-size:200% 100%!important}
.card:after{content:"LINE // 05D COURIER ID // SECURE GATEWAY"!important;animation:microPulse 2.5s ease-in-out infinite}
.card .logo{transform:translateZ(28px);text-shadow:0 0 12px #19eaff,0 0 35px #19eaff70,0 0 70px #ff3fd230!important}
.card .line{transform:translateZ(18px)}
.card .icon{
 transform:translateZ(45px);
 box-shadow:0 0 20px #19eaff35,0 0 60px #19eaff18,inset 0 0 25px #19eaff18!important;
}
.card h1{transform:translateZ(25px);text-shadow:0 8px 30px #19eaff20}
.card .desc{transform:translateZ(16px)}
.grid>div{position:relative;transform:translateZ(12px)}
.grid>div:focus-within{transform:translateZ(24px)}
input:not([type="checkbox"]){
 background:linear-gradient(145deg,#07131e,#01070c)!important;
 border-color:#19eaff25!important;
 box-shadow:inset 0 2px 10px #000,0 8px 20px #0008,0 0 0 1px #ffffff05!important;
 transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease!important;
}
input:not([type="checkbox"]):focus{
 transform:translateZ(8px) scale(1.012);
 border-color:#19eaffaa!important;
 box-shadow:inset 0 2px 10px #000,0 0 20px #19eaff20,0 12px 28px #000b!important;
}
button{
 position:relative;overflow:hidden;
 transform:translateZ(25px);
 box-shadow:0 12px 25px #19eaff20,0 0 35px #ff3fd212!important;
}
button:before{
 content:"";position:absolute;inset:-2px;
 background:linear-gradient(110deg,transparent 20%,#ffffff90 42%,transparent 58%);
 transform:translateX(-120%);animation:scan 3.2s linear infinite;pointer-events:none;
}
button:after{
 content:"";position:absolute;inset:2px;border-radius:9px;border:1px solid #ffffff35;pointer-events:none;
}
.check,.links,.hint{position:relative;z-index:3}
.card:global{transform-style:preserve-3d}
@keyframes holoLine{0%{background-position:0%}100%{background-position:200%}}
@keyframes scan{to{transform:translateX(120%)}}
@keyframes microPulse{50%{opacity:.7}}
@media(max-width:520px){
 .card{transform:none!important}
 .grid>div:focus-within{transform:none}
 input:not([type="checkbox"]):focus{transform:scale(1.008)}
}
</style>
<script id="ecomax-line-5d-tilt">
(function(){
 const card=document.querySelector('.card');
 if(!card || window.matchMedia('(pointer:coarse)').matches) return;
 let raf=0;
 function move(e){
   const r=card.getBoundingClientRect();
   const x=(e.clientX-r.left)/r.width-.5;
   const y=(e.clientY-r.top)/r.height-.5;
   cancelAnimationFrame(raf);
   raf=requestAnimationFrame(()=>card.style.transform='rotateX('+(-y*5)+'deg) rotateY('+(x*6)+'deg) translateZ(0)');
 }
 function reset(){card.style.transform='rotateX(0deg) rotateY(0deg)'}
 card.addEventListener('pointermove',move);
 card.addEventListener('pointerleave',reset);
})();
</script></head>
<body>
<main class="card">
<div class="logo">ECOMAX</div><div class="line">LINE • COURIER REGISTRATION</div>
<div class="icon">✦</div>
<h1>JOIN THE LINE</h1>
<p class="desc">შექმენი შენი კურიერის იდენტობა და შეუერთდი ECOMAX LINE-ის მიწოდების ქსელს.</p>

<form id="form">
<div class="grid">
<div><label>სახელი და გვარი</label><input id="name" autocomplete="name" required placeholder="მაგ. გიორგი ბერიძე"></div>
<div><label>ტელეფონი</label><input id="phone" type="tel" autocomplete="tel" required placeholder="+995 5XX XX XX XX"></div>
<div class="full"><label>ელფოსტა</label><input id="email" type="email" autocomplete="email" required placeholder="courier@example.com"></div>
<div><label>პაროლი</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="მინ. 8 სიმბოლო"></div>
<div><label>გაიმეორე პაროლი</label><input id="password2" type="password" autocomplete="new-password" minlength="8" required placeholder="გაიმეორე პაროლი"></div>
</div>
<label class="check"><input id="terms" type="checkbox" required><span>ვადასტურებ, რომ მოწოდებული მონაცემები სწორია და ვეთანხმები ECOMAX LINE-ის სამუშაო ანგარიშის წესებს.</span></label>
<button id="submit" type="submit">CREATE COURIER ID</button>
</form>
<div id="error" class="msg error"></div>
<div id="ok" class="msg ok"></div>
<div class="links">უკვე გაქვს ანგარიში? <a href="line-login.html">შესვლა ECOMAX LINE-ში</a><br><a href="/">← მთავარ გვერდზე</a></div>
<div class="hint">ECOMAX LINE • SECURE DELIVERY CONTROL</div>
</main>

<script>
(async function(){
const db=window.ECOMAX_SUPABASE_CLIENT;
const form=document.getElementById('form'),btn=document.getElementById('submit'),err=document.getElementById('error'),ok=document.getElementById('ok');
function showErr(t){err.textContent=t;err.style.display='block';ok.style.display='none'}
function showOk(t){ok.textContent=t;ok.style.display='block';err.style.display='none'}
if(!db){showErr('Supabase ვერ ჩაიტვირთა. გვერდი განაახლე.');return}
const {data:{session}}=await db.auth.getSession();
if(session){location.replace('line.html');return}
form.addEventListener('submit',async e=>{
 e.preventDefault();err.style.display='none';ok.style.display='none';
 const name=document.getElementById('name').value.trim();
 const phone=document.getElementById('phone').value.trim();
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const password2=document.getElementById('password2').value;
 if(password!==password2){showErr('პაროლები ერთმანეთს არ ემთხვევა.');return}
 if(password.length<8){showErr('პაროლი უნდა შეიცავდეს მინიმუმ 8 სიმბოლოს.');return}
 btn.disabled=true;btn.textContent='ანგარიში იქმნება...';
 const {data,error}=await db.auth.signUp({
   email,password,
   options:{data:{full_name:name,phone,courier_application:true}}
 });
 if(error){showErr('რეგისტრაცია ვერ შესრულდა: '+error.message);btn.disabled=false;btn.textContent='კურიერის ანგარიშის შექმნა';return}
 if(data.session){
   await db.auth.signOut();
   showOk('რეგისტრაცია დასრულებულია. თქვენი კურიერის ანგარიში ჯერ ადმინისტრატორმა უნდა დაადასტუროს. შემდეგ შეძლებთ ECOMAX LINE-ში შესვლას.');
 }else{
   showOk('რეგისტრაცია მიღებულია. შეამოწმე ელფოსტა და დაადასტურე ანგარიში. შემდეგ დაელოდე ადმინისტრატორის ავტორიზაციას.');
 }
 form.reset();btn.disabled=false;btn.textContent='კურიერის ანგარიშის შექმნა';
});
})();
</script>
</body>
</html>
