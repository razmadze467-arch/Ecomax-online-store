<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECOMAX — ავტორიზაცია / რეგისტრაცია</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #12313b 0%, #050a0e 45%, #020406 100%);
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 460px;
      background: rgba(10, 18, 24, 0.96);
      border: 1px solid #1c3d49;
      border-radius: 22px;
      padding: 35px;
      box-shadow: 0 20px 70px rgba(0,0,0,.55);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 5px;
      margin-bottom: 8px;
    }

    .logo span {
      color: #19e6ff;
    }

    .subtitle {
      text-align: center;
      color: #91a7b0;
      margin-bottom: 30px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tabs button {
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #29434e;
      background: #091219;
      color: #9eb1b9;
      cursor: pointer;
      font-size: 15px;
    }

    .tabs button.active {
      background: #19e6ff;
      color: #001015;
      border-color: #19e6ff;
      font-weight: bold;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #b8c8ce;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #29434e;
      background: #071017;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #19e6ff;
      box-shadow: 0 0 0 2px rgba(25,230,255,.1);
    }

    .submit {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #19e6ff;
      color: #001015;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 14px;
    }

    .success {
      display: block;
      background: rgba(35, 190, 130, .12);
      border: 1px solid #238e68;
      color: #7ff0c3;
    }

    .error {
      display: block;
      background: rgba(255, 70, 90, .1);
      border: 1px solid #9b3341;
      color: #ff9ba6;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #8fa5ae;
      text-decoration: none;
    }

    .back:hover {
      color: #19e6ff;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="auth-box">

  <div class="logo">
    <span>✦</span> ECOMAX
  </div>

  <div class="subtitle">
    შენი ონლაინ ანგარიში
  </div>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="showLogin()">
      ავტორიზაცია
    </button>

    <button id="registerTab" onclick="showRegister()">
      რეგისტრაცია
    </button>
  </div>

  <!-- LOGIN -->

  <form id="loginForm">

    <div class="field">
      <label>ელფოსტა</label>
      <input
        id="loginEmail"
        type="email"
        placeholder="example@gmail.com"
        required
      >
    </div>

    <div class="field">
      <label>პაროლი</label>
      <input
        id="loginPassword"
        type="password"
        placeholder="შეიყვანე პაროლი"
        required
      >
    </div>

    <button class="submit" id="loginButton">
      შესვლა
    </button>

  </form>

  <!-- REGISTER -->

  <form id="registerForm" class="hidden">

    <div class="field">
      <label>სახელი და გვარი</label>
      <input
        id="registerName"
        type="text"
        placeholder="მაგ. მარიამი რაზმაძე"
        required
      >
    </div>

    <div class="field">
      <label>ტელეფონი</label>
      <input
        id="registerPhone"
        type="tel"
        placeholder="5XXXXXXXX"
        required
      >
    </div>

    <div class="field">
      <label>მისამართი</label>
      <input
        id="registerAddress"
        type="text"
        placeholder="ქუჩა, ნომერი"
        required
      >
    </div>

    <div class="field">
      <label>ელფოსტა</label>
      <input
        id="registerEmail"
        type="email"
        placeholder="example@gmail.com"
        required
      >
    </div>

    <div class="field">
      <label>პაროლი</label>
      <input
        id="registerPassword"
        type="password"
        placeholder="მინიმუმ 6 სიმბოლო"
        minlength="6"
        required
      >
    </div>

    <button class="submit" id="registerButton">
      ანგარიშის შექმნა
    </button>

  </form>

  <div id="message" class="message"></div>

  <a href="index.html" class="back">
    ← მთავარ გვერდზე დაბრუნება
  </a>

</div>


<script>

const SUPABASE_URL =
  "https://mkxkqdvtmfbxmldnvsef.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_K5orPxr9E0q9-K0dKYdt-g_0GTFvWtd";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


function showMessage(text, type) {

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + type;
}


function showLogin() {

  document
    .getElementById("loginForm")
    .classList.remove("hidden");

  document
    .getElementById("registerForm")
    .classList.add("hidden");

  document
    .getElementById("loginTab")
    .classList.add("active");

  document
    .getElementById("registerTab")
    .classList.remove("active");

  document
    .getElementById("message")
    .className = "message";
}


function showRegister() {

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("registerForm")
    .classList.remove("hidden");

  document
    .getElementById("loginTab")
    .classList.remove("active");

  document
    .getElementById("registerTab")
    .classList.add("active");

  document
    .getElementById("message")
    .className = "message";
}


/* =========================
   LOGIN
========================= */

document
  .getElementById("loginForm")
  .addEventListener("submit", async function(e) {

    e.preventDefault();

    const button =
      document.getElementById("loginButton");

    const email =
      document.getElementById("loginEmail")
        .value
        .trim();

    const password =
      document.getElementById("loginPassword")
        .value;

    button.disabled = true;
    button.textContent = "მიმდინარეობს...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      console.error(error);

      showMessage(
        "ავტორიზაცია ვერ შესრულდა: " +
        error.message,
        "error"
      );

      button.disabled = false;
      button.textContent = "შესვლა";

      return;
    }

    showMessage(
      "ავტორიზაცია წარმატებით დასრულდა! გადამისამართება...",
      "success"
    );

    setTimeout(() => {
      window.location.href = "index.html";
    }, 700);

  });


/* =========================
   REGISTER
========================= */

document
  .getElementById("registerForm")
  .addEventListener("submit", async function(e) {

    e.preventDefault();

    const button =
      document.getElementById("registerButton");

    const name =
      document.getElementById("registerName")
        .value
        .trim();

    const phone =
      document.getElementById("registerPhone")
        .value
        .trim();

    const address =
      document.getElementById("registerAddress")
        .value
        .trim();

    const email =
      document.getElementById("registerEmail")
        .value
        .trim();

    const password =
      document.getElementById("registerPassword")
        .value;

    button.disabled = true;
    button.textContent = "იქმნება...";

    try {

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {
              full_name: name,
              phone: phone,
              address: address
            },

            emailRedirectTo:
              window.location.origin + "/"
          }

        });


      if (error)
        throw error;


      /*
        პროფილის შექმნა მაშინ,
        როცა session უკვე არსებობს.
      */

      if (data.session && data.user) {

        const { error: profileError } =
          await supabaseClient
            .from("profiles")
            .upsert({

              id: data.user.id,

              full_name: name,

              phone: phone,

              address: address,

              city: "ქუთაისი",

              updated_at:
                new Date().toISOString()

            });


        if (profileError)
          console.error(profileError);


        showMessage(
          "რეგისტრაცია წარმატებით დასრულდა! გადამისამართება...",
          "success"
        );

        setTimeout(() => {
          window.location.href = "index.html";
        }, 700);

      } else {

        showMessage(
          "ანგარიში შეიქმნა! 📧 შეამოწმე ელფოსტა და დაადასტურე ანგარიში.",
          "success"
        );

        button.disabled = false;
        button.textContent = "ანგარიშის შექმნა";
      }

    } catch (error) {

      console.error(error);

      let message =
        error.message || "უცნობი შეცდომა";

      if (
        message
          .toLowerCase()
          .includes("user already registered")
      ) {
        message =
          "ეს ელფოსტა უკვე რეგისტრირებულია.";
      }

      if (
        message
          .toLowerCase()
          .includes("password")
      ) {
        message =
          "პაროლი უნდა შეიცავდეს მინიმუმ 6 სიმბოლოს.";
      }

      showMessage(
        "რეგისტრაცია ვერ შესრულდა: " +
        message,
        "error"
      );

      button.disabled = false;
      button.textContent = "ანგარიშის შექმნა";
    }

  });


/* =========================
   SESSION CHECK
========================= */

async function checkSession() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (session) {

    showMessage(
      "უკვე შესული ხარ ანგარიშში.",
      "success"
    );

  }

}

checkSession();

</script>

</body>
</html>
