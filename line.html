<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ECOMAX LINE — Delivery</title>
<style>
:root{--bg:#03070b;--card:#09131d;--cyan:#19e6ff;--blue:#4aa8ff;--green:#45e3a3;--yellow:#ffd76a;--red:#ff647d;--muted:#8da5b0;--text:#effcff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#063441,transparent 30%),radial-gradient(circle at 90% 20%,#171040,transparent 30%),#03070b;color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:#03070bea;border-bottom:1px solid #19e6ff22;backdrop-filter:blur(14px)}
.nav{width:min(1200px,calc(100% - 24px));margin:auto;min-height:68px;display:flex;align-items:center;gap:14px}.logo{font-weight:1000;letter-spacing:4px;color:var(--cyan);text-shadow:0 0 18px #19e6ff55}.sub{font-size:10px;color:#7d96a1;letter-spacing:2px}.nav a{margin-left:auto;color:#b9cbd2;text-decoration:none;font-size:12px}.nav a:hover{color:var(--cyan)}
main{width:min(1200px,calc(100% - 24px));margin:26px auto 60px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:18px}.hero h1{font-size:clamp(30px,5vw,56px);margin:5px 0}.eyebrow{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:3px}.hero p{color:var(--muted);margin:0}.refresh{border:1px solid #19e6ff35;background:#07151f;color:var(--cyan);border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:linear-gradient(145deg,#0b1924,#050b10);border:1px solid #ffffff12;border-radius:17px;padding:17px}.stat small{color:var(--muted);display:block;font-size:10px}.stat b{display:block;font-size:28px;margin-top:7px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{min-height:44px;background:#071018;color:var(--text);border:1px solid #ffffff18;border-radius:11px;padding:0 12px;outline:none}.toolbar input{flex:1;min-width:190px}.toolbar input:focus,.toolbar select:focus{border-color:#19e6ff88;box-shadow:0 0 18px #19e6ff18}
.orders{display:grid;gap:13px}.order{background:linear-gradient(145deg,#0b1823,#050b11);border:1px solid #19e6ff1c;border-radius:19px;padding:18px;box-shadow:inset 0 0 30px #19e6ff05}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.num{font-weight:1000;letter-spacing:.7px}.customer{color:#b8cbd2;font-size:12px;margin-top:5px}.badge{border:1px solid #ffffff20;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900;white-space:nowrap}.badge.new{color:var(--cyan)}.badge.processing{color:var(--yellow)}.badge.loaded{color:#8bdcff}.badge.picked_up{color:#b78cff}.badge.shipped{color:#7db5ff}.badge.completed{color:var(--green)}.badge.cancelled{color:var(--red)}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:15px}.box{border:1px solid #ffffff10;border-radius:14px;padding:13px;background:#ffffff03}.box small{color:var(--muted);display:block;font-size:9px;margin-bottom:5px}.box b{font-size:13px}.items{font-size:11px;line-height:1.8;color:#b9cbd2}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{min-height:42px;border-radius:10px;padding:0 12px;border:1px solid #ffffff18;background:#07131c;color:var(--text);cursor:pointer;font-weight:800}.actions button:hover{border-color:#19e6ff77;box-shadow:0 0 16px #19e6ff18}.actions .go{color:var(--cyan);border-color:#19e6ff38}.actions .done{color:var(--green);border-color:#45e3a338}.actions .danger{color:#ff9aaa;border-color:#ff647d35}.empty{text-align:center;padding:35px;border:1px dashed #19e6ff2a;border-radius:17px;color:var(--muted)}
.overlay{position:fixed;inset:0;z-index:50;background:#000b;display:none;place-items:center;padding:15px}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#0c1a26,#050a10);border:1px solid #19e6ff35;border-radius:20px;padding:20px;box-shadow:0 30px 100px #000}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px;border-radius:10px;border:1px solid #ff647d40;background:#190a0e;color:#ff9aaa;font-size:20px;cursor:pointer}.modal label{display:block;color:var(--muted);font-size:10px;margin:15px 0 6px}.modal input,.modal textarea{width:100%;background:#050c12;color:var(--text);border:1px solid #ffffff18;border-radius:10px;padding:12px;outline:none}.modal textarea{min-height:80px;resize:vertical}.modal .save{margin-top:15px;width:100%;min-height:46px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#001016;font-weight:1000;cursor:pointer}
.toast{position:fixed;right:16px;bottom:16px;z-index:80;background:#07151f;border:1px solid #19e6ff44;color:#dffaff;padding:13px 16px;border-radius:12px;display:none}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.refresh{width:100%}}
@media(max-width:430px){.stats{grid-template-columns:1fr 1fr}.stat b{font-size:23px}.order{padding:14px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20260920-1"></script>
</head>
<body>
<header><div class="nav"><div><div class="logo">ECOMAX LINE</div><div class="sub">DELIVERY CONTROL</div></div><a href="admin.html">← Admin</a></div></header>
<main>
<section class="hero"><div><div class="eyebrow">LIVE DELIVERY NETWORK</div><h1>მიწოდების მართვა</h1><p id="access">სისტემა იტვირთება...</p></div><button class="refresh" id="refresh">↻ განახლება</button></section>
<section class="stats"><div class="stat"><small>აქტიური</small><b id="sActive">0</b></div><div class="stat"><small>ახალი</small><b id="sNew">0</b></div><div class="stat"><small>გზაში</small><b id="sRoad">0</b></div><div class="stat"><small>ჩაბარებული</small><b id="sDone">0</b></div></section>
<div class="toolbar"><input id="search" placeholder="შეკვეთის ნომერი, სახელი, ტელეფონი..."><select id="filter"><option value="active">აქტიური შეკვეთები</option><option value="all">ყველა</option><option value="new">ახალი</option><option value="processing">მუშავდება</option><option value="loaded">დატვირთული</option><option value="picked_up">კურიერმა აიღო</option><option value="shipped">გზაში</option><option value="completed">ჩაბარდა</option></select></div>
<section class="orders" id="orders"><div class="empty">იტვირთება...</div></section>
</main>
<div class="overlay" id="overlay"><div class="modal"><div class="modalhead"><div><div class="eyebrow">ECOMAX LINE</div><h2 id="mTitle">კურიერის მართვა</h2></div><button class="close" id="close">×</button></div><div id="mBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const db=window.ECOMAX_SUPABASE_CLIENT;
const $=id=>document.getElementById(id);
const labels={new:'ახალი',processing:'მუშავდება',loaded:'ტვირთი დაიტვირთა',picked_up:'კურიერმა აიღო',shipped:'გზაშია',completed:'ჩაბარდა',cancelled:'გაუქმდა'};
const next={new:'processing',processing:'loaded',loaded:'picked_up',picked_up:'shipped',shipped:'completed'};
let orders=[], user=null, admin=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return Number(v||0).toFixed(2)+' ₾';}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200);}
function dt(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleString('ka-GE',{dateStyle:'short',timeStyle:'short'});}
function items(o){const a=Array.isArray(o.items)?o.items:[];return a.map(x=>esc(x.name||x.product_name||'პროდუქტი')+' × '+esc(x.quantity??x.qty??1)).join('<br>')||'—';}
async function boot(){
 if(!db){$('access').textContent='Supabase ვერ ჩაიტვირთა';return;}
 const {data:{user:u}}=await db.auth.getUser(); user=u;
 if(!u){location.href='login.html?next=line.html';return;}
 admin=!!u.user_metadata?.is_admin || u.email==='razmadze467-arch@users.noreply.github.com';
 $('access').textContent=admin?'ADMIN • ECOMAX LINE სრული წვდომა':'COURIER • მინიჭებული შეკვეთები';
 await load();
}
async function load(){
 $('orders').innerHTML='<div class="empty">შეკვეთები იტვირთება...</div>';
 let q=db.from('orders').select('*').order('created_at',{ascending:false});
 if(!admin) q=q.eq('courier_id',user.id);
 const {data,error}=await q;
 if(error){$('orders').innerHTML='<div class="empty">შეკვეთების ჩატვირთვა ვერ მოხერხდა: '+esc(error.message)+'</div>';return;}
 orders=data||[]; render();
}
function render(){
 const term=($('search').value||'').toLowerCase().trim(), f=$('filter').value;
 let list=orders.filter(o=>{
  const hay=[o.order_number,o.customer_name,o.phone,o.city,o.address,o.courier_name].join(' ').toLowerCase();
  const okSearch=!term||hay.includes(term);
  const okFilter=f==='all'||(f==='active'&&!['completed','cancelled'].includes(o.status))||o.status===f;
  return okSearch&&okFilter;
 });
 $('sActive').textContent=orders.filter(o=>!['completed','cancelled'].includes(o.status)).length;
 $('sNew').textContent=orders.filter(o=>o.status==='new').length;
 $('sRoad').textContent=orders.filter(o=>['picked_up','shipped'].includes(o.status)).length;
 $('sDone').textContent=orders.filter(o=>o.status==='completed').length;
 if(!list.length){$('orders').innerHTML='<div class="empty">შეკვეთა ვერ მოიძებნა.</div>';return;}
 $('orders').innerHTML=list.map(o=>{
  const n=next[o.status], closed=['completed','cancelled'].includes(o.status);
  return '<article class="order"><div class="top"><div><div class="num">'+esc(o.order_number||('ECX-'+String(o.id).slice(0,8).toUpperCase()))+'</div><div class="customer">'+esc(o.customer_name||'—')+' • '+esc(o.phone||'—')+'</div></div><span class="badge '+esc(o.status)+'">'+esc(labels[o.status]||o.status||'—')+'</span></div>'+
  '<div class="grid"><div class="box"><small>მისამართი</small><b>'+esc([o.city,o.address].filter(Boolean).join(', ')||'—')+'</b><div class="items" style="margin-top:10px">'+items(o)+'</div></div><div class="box"><small>შეკვეთის თანხა</small><b>'+money(o.total)+'</b><div class="items" style="margin-top:10px">კურიერი: '+esc(o.courier_name||'არ არის მინიჭებული')+'<br>ETA: '+dt(o.estimated_arrival_at)+'</div></div></div>'+
  '<div class="actions">'+(!closed&&n?'<button class="go" data-next="'+esc(o.id)+'">→ '+esc(labels[n])+'</button>':'')+'<button data-edit="'+esc(o.id)+'">⚙ დეტალები</button>'+(admin?'<button class="danger" data-assign="'+esc(o.id)+'">👤 კურიერი</button>':'')+'</div></article>';
 }).join('');
}
async function advance(id){
 const o=orders.find(x=>String(x.id)===String(id)); if(!o)return;
 const ns=next[o.status]; if(!ns)return;
 await updateStatus(o,ns,null);
}
async function updateStatus(o,status,eta){
 let result;
 if(admin){
  result=await db.from('orders').update({status,estimated_arrival_at:eta||o.estimated_arrival_at||null,updated_at:new Date().toISOString()}).eq('id',o.id);
 }else{
  result=await db.rpc('ecomax_line_update_order',{p_order_id:o.id,p_status:status,p_estimated_arrival_at:eta||null});
 }
 if(result.error){toast(result.error.message);return;}
 toast('სტატუსი განახლდა ✓'); await load();
}
function openDetails(o){
 $('mTitle').textContent=o.order_number||'შეკვეთა';
 $('mBody').innerHTML='<label>სტატუსი</label><select id="mStatus" style="width:100%;min-height:44px;background:#050c12;color:#fff;border:1px solid #ffffff18;border-radius:10px;padding:10px">'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'" '+(o.status===k?'selected':'')+'>'+v+'</option>').join('')+'</select><label>სავარაუდო ჩამოსვლა</label><input id="mEta" type="datetime-local" value="'+(o.estimated_arrival_at?new Date(o.estimated_arrival_at).toISOString().slice(0,16):'')+'"><label>მისამართი</label><textarea readonly>'+esc([o.customer_name,o.phone,o.city,o.address].filter(Boolean).join('\n'))+'</textarea><button class="save" id="mSave">შენახვა</button>';
 $('overlay').style.display='grid';
 $('mSave').onclick=async()=>{const st=$('mStatus').value;const eta=$('mEta').value?new Date($('mEta').value).toISOString():null;await updateStatus(o,st,eta);$('overlay').style.display='none';};
}
function assign(o){
 $('mTitle').textContent='კურიერის მინიჭება';
 $('mBody').innerHTML='<p style="color:#8da5b0;font-size:12px">კურიერის Supabase User ID ჩაწერე. კურიერის ანგარიში უნდა იყოს Supabase Auth-ში და მის <b>app_metadata.role</b>-ში უნდა ეწეროს <b>courier</b>.</p><label>Courier User ID</label><input id="cId" value="'+esc(o.courier_id||'')+'" placeholder="UUID"><label>სახელი</label><input id="cName" value="'+esc(o.courier_name||'')+'"><label>ტელეფონი</label><input id="cPhone" value="'+esc(o.courier_phone||'')+'"><button class="save" id="cSave">კურიერის მინიჭება</button>';
 $('overlay').style.display='grid';
 $('cSave').onclick=async()=>{const cid=$('cId').value.trim()||null;const {error}=await db.from('orders').update({courier_id:cid,courier_name:$('cName').value.trim()||null,courier_phone:$('cPhone').value.trim()||null,line_assigned_at:cid?new Date().toISOString():null}).eq('id',o.id);if(error){toast(error.message);return;}toast(cid?'კურიერი მიენიჭა ✓':'კურიერი მოიხსნა ✓');$('overlay').style.display='none';await load();};
}
$('refresh').onclick=load;$('search').oninput=render;$('filter').onchange=render;$('close').onclick=()=>$('overlay').style.display='none';$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').style.display='none';};
$('orders').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.next||b.dataset.edit||b.dataset.assign;const o=orders.find(x=>String(x.id)===String(id));if(!o)return;if(b.dataset.next)advance(id);else if(b.dataset.edit)openDetails(o);else assign(o);};
db?.channel('ecomax-line-live').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>load()).subscribe();
boot();
})();
</script>
</body>
</html>
