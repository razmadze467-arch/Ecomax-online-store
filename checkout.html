<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#020812"><title>ECOMAX • შეკვეთა</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260915-4"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020812;color:#eafaff;font-family:Arial,"Noto Sans Georgian",sans-serif}body{overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 8%,rgba(0,234,255,.13),transparent 28%),radial-gradient(circle at 90% 20%,rgba(124,60,255,.13),transparent 32%),linear-gradient(rgba(0,234,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,234,255,.035) 1px,transparent 1px);background-size:auto,auto,58px 58px,58px 58px;z-index:-1}.wrap{width:min(1100px,100%);margin:auto;padding:24px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-size:27px;font-weight:950;letter-spacing:5px;color:#00eaff;text-shadow:0 0 24px rgba(0,234,255,.28)}.back{border:1px solid rgba(0,234,255,.25);background:rgba(0,234,255,.05);padding:10px 15px;border-radius:11px;color:#dffaff;transition:.2s}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:20px}.box{background:rgba(5,22,36,.88);border:1px solid rgba(0,234,255,.16);border-radius:20px;padding:23px;box-shadow:0 18px 65px rgba(0,0,0,.35),0 0 35px rgba(0,234,255,.04);backdrop-filter:blur(14px)}h1{margin:5px 0 8px;font-size:clamp(28px,5vw,38px);line-height:1.08}h2{margin-top:0}.muted{color:#86aebc}label{display:block;margin:15px 0 7px;font-weight:800;font-size:13px;color:#c9edf5}input,select,textarea{width:100%;padding:14px;border-radius:11px;border:1px solid #15586b;background:#061925;color:#fff;font-size:15px;outline:none}textarea{min-height:92px;resize:vertical}.item{display:flex;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid rgba(0,234,255,.09)}.item-name{font-weight:800}.item b{color:#00eaff;white-space:nowrap}.total{display:flex;justify-content:space-between;font-size:23px;font-weight:950;padding-top:19px}.submit{width:100%;margin-top:20px;padding:16px;border:0;border-radius:13px;background:linear-gradient(100deg,#00d9ef,#00a8ff);color:#00131c;font-size:17px;font-weight:950;cursor:pointer;transition:.25s}.submit:disabled{opacity:.48;cursor:not-allowed}.msg{margin-top:15px;padding:13px;border-radius:11px;display:none;line-height:1.45}.error{display:block;background:rgba(75,24,32,.8);border:1px solid rgba(255,90,110,.2)}.hidden{display:none!important}.success-screen{text-align:center;padding:55px 20px}.success-icon{font-size:58px;color:#48f0b0}.order-id{font-size:19px;color:#00eaff;margin:20px 0}.errcode{display:block;margin-top:8px;font-size:12px;opacity:.85;word-break:break-word}.secure{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.secure span{font-size:11px;color:#83aeba;border:1px solid rgba(0,234,255,.12);border-radius:999px;padding:6px 9px;background:rgba(0,234,255,.035)}@media(max-width:750px){.wrap{padding:16px 12px 35px}.grid{grid-template-columns:1fr}.box{padding:17px}h1{font-size:29px}}
</style><style id="ecomax-global-neon-boost">
/* Lightweight global blue/cyan neon polish — visual only */
@keyframes ecomaxNeonBreath{0%,100%{text-shadow:0 0 4px rgba(0,234,255,.25),0 0 12px rgba(0,140,255,.12)}50%{text-shadow:0 0 8px rgba(0,234,255,.55),0 0 20px rgba(0,140,255,.22)}}
@keyframes ecomaxLineFlow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
body{background-image:radial-gradient(circle at 15% 10%,rgba(0,234,255,.09),transparent 28%),radial-gradient(circle at 88% 22%,rgba(50,140,255,.09),transparent 30%),linear-gradient(rgba(0,234,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(50,140,255,.022) 1px,transparent 1px);background-size:auto,auto,44px 44px,44px 44px}
h1,h2,h3,h4,.logo,.brand,.section-title,.product-name,.product-title,.price,.hero-badge,.tag,.eyebrow{animation:ecomaxNeonBreath 3.2s ease-in-out infinite}
button,.primary-button,.secondary-button,.cart-button,.back,.login-link,.register-link,.iconbtn,.primary,.ghost{
 transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease!important;
}
button:hover,.primary-button:hover,.secondary-button:hover,.cart-button:hover,.back:hover,.login-link:hover,.register-link:hover,.iconbtn:hover,.primary:hover,.ghost:hover{
 box-shadow:0 0 12px rgba(0,234,255,.28),0 0 28px rgba(50,140,255,.13)!important;
 border-color:rgba(0,234,255,.7)!important;
}
a:hover{ text-shadow:0 0 8px rgba(0,234,255,.35)}
@media(prefers-reduced-motion:reduce){h1,h2,h3,h4,.logo,.brand,.section-title,.product-name,.product-title,.price,.hero-badge,.tag,.eyebrow{animation:none!important}}
</style></head>
<body><div class="wrap"><header class="top"><a class="logo" href="index.html">ECOMAX</a><a class="back" href="index.html">← დაბრუნება</a></header>
<div id="checkout"><div class="grid"><section class="box"><h1>შეკვეთის გაფორმება</h1><p class="muted">შეავსე მონაცემები და გადაამოწმე შეკვეთა.</p><form id="orderForm" novalidate>
<label for="customerName">სახელი და გვარი *</label><input id="customerName" required autocomplete="name"><label for="phone">ტელეფონი *</label><input id="phone" required type="tel" inputmode="tel" autocomplete="tel" placeholder="5XX XX XX XX"><label for="city">ქალაქი *</label><input id="city" required autocomplete="address-level2"><label for="address">მისამართი</label><textarea id="address" autocomplete="street-address" placeholder="ქუჩა, ნომერი, ბინა"></textarea><label for="delivery">მიტანის მეთოდი</label><select id="delivery"><option value="delivery">კურიერით მიწოდება</option><option value="pickup">თვითგატანა</option></select><label for="payment">გადახდის მეთოდი</label><select id="payment"><option value="cash">ნაღდი ანგარიშსწორება</option><option value="card">ბარათით გადახდა — მალე</option></select><button class="submit" id="submitBtn" type="submit">შეკვეთის დადასტურება →</button><div id="msg" class="msg"></div><div class="secure"><span>🔐 ავტორიზაცია</span><span>✓ Supabase</span><span>✓ Admin-ში იგზავნება</span></div></form></section>
<section class="box"><h2>შენი კალათა</h2><div id="items"></div><div class="total"><span>ჯამი</span><span id="total">0 ₾</span></div></section></div></div>
<div id="success" class="box success-screen hidden"><div class="success-icon">✓</div><h1>შეკვეთა მიღებულია!</h1><p class="muted">შეკვეთა წარმატებით გაიგზავნა ECOMAX-ის ადმინისტრატორთან.</p><div class="order-id" id="orderId"></div><a class="submit" style="display:inline-block;width:auto;text-decoration:none" href="index.html">მთავარ გვერდზე დაბრუნება</a></div></div>
<script>
'use strict';
function safeCart(){try{const x=JSON.parse(localStorage.getItem('ecomax_cart')||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
let cart=safeCart();const itemsEl=document.getElementById('items'),totalEl=document.getElementById('total'),form=document.getElementById('orderForm'),msg=document.getElementById('msg'),btn=document.getElementById('submitBtn');
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));function cartTotal(){return cart.reduce((s,i)=>s+Number(i.price||0)*Number(i.quantity||0),0)}
function render(){cart=safeCart();if(!cart.length){itemsEl.innerHTML='<p class="muted">კალათა ცარიელია. დაბრუნდი პროდუქტებზე.</p>';btn.disabled=true;totalEl.textContent='0 ₾';return}btn.disabled=false;itemsEl.innerHTML=cart.map(i=>'<div class="item"><span><span class="item-name">'+esc(i.name)+'</span><br><small class="muted">'+esc(i.volume)+' × '+Number(i.quantity||0)+'</small></span><b>'+Number(i.price||0)*Number(i.quantity||0)+' ₾</b></div>').join('');totalEl.textContent=cartTotal()+' ₾'}
render();
async function getClient(){if(window.ECOMAX_AUTH_READY)await window.ECOMAX_AUTH_READY;const client=window.ECOMAX_SUPABASE_CLIENT||window.ECOMAX_AUTH_CLIENT;if(!client||!client.auth)throw new Error('ECOMAX Supabase client unavailable');return client}
async function getAuthenticatedUser(){const client=await getClient();for(let attempt=0;attempt<8;attempt++){const r=await client.auth.getSession();if(r?.data?.session?.user)return{client,user:r.data.session.user};await new Promise(r=>setTimeout(r,300))}const r=await client.auth.getUser();return{client,user:r?.data?.user||null}}
async function loadUser(){try{const a=await getAuthenticatedUser();if(a.user){const n=a.user.user_metadata?.full_name||a.user.user_metadata?.name||'';if(n)document.getElementById('customerName').value=n}}catch(e){console.warn(e)}}loadUser();
form.addEventListener('submit',async e=>{e.preventDefault();cart=safeCart();if(!cart.length)return;if(!form.checkValidity()){form.reportValidity();return}btn.disabled=true;btn.textContent='იგზავნება...';msg.style.display='none';try{const a=await getAuthenticatedUser();if(!a.user){window.location.href='login.html?redirect=checkout.html';return}const payload={user_id:a.user.id,status:'new',customer_name:document.getElementById('customerName').value.trim(),phone:document.getElementById('phone').value.trim(),city:document.getElementById('city').value.trim(),address:document.getElementById('address').value.trim(),items:cart,total:cartTotal(),payment_method:document.getElementById('payment').value,delivery_method:document.getElementById('delivery').value};const {error}=await a.client.from('orders').insert(payload);if(error)throw error;const orderId='ECX-'+Date.now().toString(36).toUpperCase();localStorage.removeItem('ecomax_cart');document.getElementById('checkout').classList.add('hidden');document.getElementById('orderId').textContent='შეკვეთის კოდი: '+orderId;document.getElementById('success').classList.remove('hidden')}catch(err){console.error(err);msg.innerHTML='<b>შეკვეთის გაგზავნა ვერ მოხერხდა.</b><span class="errcode">'+esc(err?.message||err?.details||String(err))+'</span>';msg.className='msg error';msg.style.display='block';btn.disabled=false;btn.textContent='შეკვეთის დადასტურება →'}});
</script></body></html>
